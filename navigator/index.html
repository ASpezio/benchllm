<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>body{margin:0;font:14px/1.45 system-ui,-apple-system,sans-serif}img{max-width:100%}.chip.cons { background: var(--reg-bg); color: var(--reg); border-color: transparent; }
.chip.docname { font-size: 12px; white-space: nowrap; max-width: 320px; overflow: hidden; text-overflow: ellipsis; }
.chip.lab { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.note-src { margin: 6px 0 0; font-size: 13px; color: var(--muted); }
</style>
<script>(function(){var t="light";try{t=localStorage.getItem("fop-theme")||"light"}catch(e){}document.documentElement.setAttribute("data-theme",t)})();</script>
<title>Навигатор приказа ФОП</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=PT+Mono&family=PT+Sans:ital,wght@0,400;0,700;1,400&family=PT+Serif:wght@700&display=swap">
<style>
/* Layout: рабочий инструмент в два поля — слева реестр пунктов приказа, справа карточка пункта над листом PDF с отметкой маркером. */
:root {
  --bg: #e9edf1;
  --panel: #f7f9fb;
  --ink: #18222d;
  --muted: #5a6676;
  --line: #d3dae2;
  --accent: #1e4c7e;
  --accent-soft: #dce6f1;
  --sheet: #c3cbd4;
  --mark: rgba(255, 207, 0, 0.42);
  --mark-edge: #d9a400;
  --rev: #7d5200;
  --rev-bg: #f4e7cc;
  --reg: #24603f;
  --reg-bg: #d9ede2;
  --warn: #9b3424;
  --warn-bg: #f5e0db;
  --f-display: "PT Serif", Georgia, "Times New Roman", serif;
  --f-body: "PT Sans", "Segoe UI", Roboto, Arial, sans-serif;
  --f-mono: "PT Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11161c; --panel: #182029; --ink: #e2e8ee; --muted: #94a2b1; --line: #29343f;
    --accent: #86b4e8; --accent-soft: #1d2f44; --sheet: #0b0f13;
    --mark: rgba(255, 207, 0, 0.36); --mark-edge: #f0c000;
    --rev: #e6b866; --rev-bg: #3a2c12; --reg: #86cfa8; --reg-bg: #163224; --warn: #f19a87; --warn-bg: #3d1f19;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11161c; --panel: #182029; --ink: #e2e8ee; --muted: #94a2b1; --line: #29343f;
  --accent: #86b4e8; --accent-soft: #1d2f44; --sheet: #0b0f13;
  --mark: rgba(255, 207, 0, 0.36); --mark-edge: #f0c000;
  --rev: #e6b866; --rev-bg: #3a2c12; --reg: #86cfa8; --reg-bg: #163224; --warn: #f19a87; --warn-bg: #3d1f19;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { height: 100%; display: grid; grid-template-columns: minmax(300px, 390px) minmax(0, 1fr); gap: 16px; padding-inline: 16px; padding-block: 12px; }
.side, .main { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
.side { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.side-head { padding: 14px 16px 10px; border-bottom: 1px solid var(--line); display: grid; gap: 8px; }
.side-head h1 { font-family: var(--f-display); font-size: 19px; line-height: 1.2; margin: 0; text-wrap: balance; }
.side-head p { margin: 0; color: var(--muted); font-size: 13px; }
.search { position: relative; }
.search input { width: 100%; padding: 8px 34px 8px 10px; border: 1px solid var(--line); border-radius: 7px; background: var(--bg); color: var(--ink); font: inherit; }
.search kbd { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); font-family: var(--f-mono); font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px; font-size: 12px; color: var(--muted); }

.tree, .results { overflow: auto; flex: 1; padding: 6px 6px 16px; }
.row { display: grid; grid-template-columns: 14px minmax(0, 1fr) auto; gap: 6px; align-items: baseline; width: 100%; text-align: left; background: none; border: 0; border-radius: 6px; padding: 5px 8px; cursor: pointer; }
.row:hover { background: var(--accent-soft); }
.row.sel { background: var(--accent); color: var(--panel); }
.row.sel .pg, .row.sel .sub, .row.sel .code { color: inherit; opacity: .85; }
.caret { color: var(--muted); font-size: 10px; transition: transform .12s; }
.row[aria-expanded="true"] .caret { transform: rotate(90deg); }
.row.sel .caret { color: inherit; }
.lab { min-width: 0; overflow: hidden; }
.lab .main-l { display: block; }
.lab .sub { color: var(--muted); font-size: 12.5px; }
.t-part > .row .main-l { font-family: var(--f-display); font-size: 16px; }
.t-subj > .row .main-l { font-weight: 700; }
.t-rec > .row .main-l { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-size: 13.5px; }
.code { font-family: var(--f-mono); font-size: 12.5px; color: var(--accent); margin-right: 6px; }
.pg { font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.kids { padding-left: 12px; border-left: 1px solid var(--line); margin-left: 14px; }

.chip { display: inline-block; font-size: 11.5px; line-height: 1.5; padding: 0 7px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.chip.rev { background: var(--rev-bg); color: var(--rev); }
.chip.reg { background: var(--reg-bg); color: var(--reg); }
.chip.warn { background: var(--warn-bg); color: var(--warn); }
.chip.ok { background: var(--reg-bg); color: var(--reg); }
.row.sel .chip { background: var(--panel); }

.results .hit { display: grid; gap: 2px; width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line); padding: 8px 8px; cursor: pointer; }
.results .hit:hover { background: var(--accent-soft); }
.results .crumb { font-size: 12px; color: var(--muted); }
.results .txt { font-size: 13.5px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.results mark { background: var(--mark); color: inherit; border-radius: 2px; }
.results .count { padding: 4px 8px 8px; font-size: 12.5px; color: var(--muted); }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 18px; display: grid; gap: 8px; max-height: 42%; overflow: auto; }
.crumbs { display: flex; flex-wrap: wrap; gap: 4px; font-size: 12.5px; color: var(--muted); align-items: baseline; }
.crumbs button { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; text-decoration-color: var(--line); }
.crumbs span.sep { color: var(--line); }
.card h2 { margin: 0; font-family: var(--f-display); font-size: 20px; line-height: 1.25; text-wrap: balance; }
.card h2 .code { font-size: 17px; }
.card .body { margin: 0; max-width: 75ch; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.idline { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 12.5px; color: var(--muted); }
.idline code { font-family: var(--f-mono); color: var(--ink); background: var(--bg); padding: 1px 6px; border-radius: 4px; overflow-wrap: anywhere; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 3px 10px; cursor: pointer; font-size: 13px; }
.btn:hover { border-color: var(--accent); color: var(--accent); }
.rel { display: flex; flex-wrap: wrap; gap: 6px; align-items: baseline; font-size: 13px; }
.rel b { font-weight: 400; color: var(--muted); }
.rel button { border: 1px solid var(--line); background: var(--bg); border-radius: 5px; padding: 1px 7px; cursor: pointer; font-size: 12.5px; max-width: 100%; text-align: left; }
.rel button:hover { border-color: var(--accent); }

.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 2px 8px; }
.toolbar .pgin { width: 64px; padding: 3px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--ink); font-family: var(--f-mono); text-align: center; }
.toolbar .status { margin-left: auto; font-size: 12.5px; color: var(--muted); }
.viewer { position: relative; flex: 1; min-height: 0; overflow: auto; background: var(--sheet); border-radius: 10px; padding: 16px; }
.sheet { position: relative; margin: 0 auto; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); }
.sheet canvas { display: block; }
.hl { position: absolute; background: var(--mark); border-bottom: 2px solid var(--mark-edge); mix-blend-mode: multiply; border-radius: 2px; pointer-events: none; }
:root[data-theme="dark"] .hl { mix-blend-mode: normal; }
.loading { color: var(--ink); background: var(--panel); border-radius: 8px; padding: 18px; max-width: 520px; margin: 40px auto; display: grid; gap: 10px; }
.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
.toast { font-size: 12.5px; color: var(--rev); background: var(--rev-bg); padding: 2px 8px; border-radius: 5px; }

.tabs { display: flex; flex-wrap: wrap; gap: 6px; padding-bottom: 10px; }
.tab { border: 1px solid var(--line); background: var(--panel); border-radius: 7px; padding: 5px 12px; cursor: pointer; font-size: 14px; }
.mathbox { margin: 8px 0 2px; padding: 10px 12px; border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 8px; background: var(--bg); font-size: 15px; line-height: 1.6; overflow-x: auto; }
.mathbox .mlab { font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-bottom: 4px; }
.lnk img.thumb { max-height: 90px; width: auto; display: inline-block; margin: 2px 6px 2px 0; }
.mathbox img, .lnk img { max-width: min(100%, 320px); height: auto; vertical-align: middle; background: #fff; border-radius: 3px; }
.lnk .katex { font-size: 1.02em; }
.chip.deep { color: #5b3596; background: #ebe2f7; }
:root[data-theme="dark"] .chip.deep { color: #cdb4f5; background: #2e2342; }
.tab.theme { margin-left: auto; color: var(--muted); }
.tab.theme:hover { color: var(--ink); }
.tab[aria-pressed="true"] { background: var(--accent); color: var(--panel); border-color: var(--accent); }
.links { flex: 1; min-height: 0; overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 18px; display: grid; align-content: start; gap: 12px; }
.lk-head { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
.seg button { border: 0; background: none; padding: 4px 10px; cursor: pointer; font-size: 13px; }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.lk-sum { font-size: 13.5px; color: var(--muted); }
.lk-sum b { color: var(--ink); font-weight: 700; }
.skills { border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; background: var(--bg); }
.skills summary { cursor: pointer; font-size: 14px; }
.skills summary small { color: var(--muted); }
.skills .grp { margin-top: 10px; font-size: 13px; font-weight: 700; }
.skills ul { margin: 4px 0 0; padding: 0; list-style: none; display: grid; gap: 2px; }
.skills li button { background: none; border: 0; padding: 2px 0; text-align: left; cursor: pointer; font-size: 13.5px; color: var(--ink); }
.skills li button:hover { color: var(--accent); }
.skills .vb { font-family: var(--f-mono); font-size: 12px; color: var(--accent); }
.lrow { display: grid; grid-template-columns: 44px minmax(0, 1fr) minmax(0, 1.5fr) 110px; gap: 12px; padding: 7px 4px; border-bottom: 1px solid var(--line); align-items: start; }
.lrow.e { grid-template-columns: 52px minmax(0, 1.7fr) 92px minmax(0, 1fr); }
.lrow.l5 { grid-template-columns: 40px minmax(0, 1fr) minmax(0, 1.4fr) 130px 104px; }
.lrow.e5 { grid-template-columns: 52px minmax(0, 1.6fr) 130px 96px minmax(0, 0.9fr); }
.lrow.x { grid-template-columns: 56px minmax(0, 1.3fr) minmax(0, 1.3fr) 76px; }
.lrow.head { font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); border-bottom: 2px solid var(--line); }
.lsec { padding: 14px 4px 4px; font-family: var(--f-display); font-size: 15px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.lrow .num { font-family: var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.lnk { background: none; border: 0; padding: 0; text-align: left; cursor: pointer; color: var(--ink); font-size: 14px; }
.lnk:hover { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }
.lrow .el + .el { margin-top: 5px; }
.lrow.rev { color: var(--muted); }
.lrow.rev .lnk { color: var(--muted); }
.lrow.zero { background: var(--warn-bg); }
.lchips { display: flex; flex-wrap: wrap; gap: 4px; }
.lchips button { border: 1px solid var(--line); background: var(--bg); border-radius: 5px; padding: 0 6px; font-family: var(--f-mono); font-size: 12px; cursor: pointer; }
.lchips button:hover { border-color: var(--accent); }
.lk-empty { color: var(--muted); padding: 12px 4px; }
.skills li { display: flex; gap: 10px; align-items: baseline; justify-content: space-between; }
.skills li > button { flex: 1 1 auto; }
.skills li .lchips { flex: none; justify-content: flex-end; }
.skills li .lchips button { border: 1px solid var(--line); background: var(--bg); border-radius: 5px; padding: 0 6px; font-family: var(--f-mono); font-size: 12px; }
.skills li .lchips button:hover { border-color: var(--accent); color: var(--ink); }
.nox { font-size: 11.5px; color: var(--muted); white-space: nowrap; }
.lrow.xr { grid-template-columns: 40px minmax(0, 1.1fr) minmax(0, 1.5fr) 52px; }
.byg { display: flex; flex-wrap: wrap; gap: 4px; align-items: baseline; }
.byg + .byg { margin-top: 4px; }
.byg .gl { font-size: 11.5px; color: var(--muted); min-width: 40px; }
@media (max-width: 820px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: 44% minmax(0, 1fr); height: auto; min-height: 100%; }
  .main { min-height: 80vh; }
  .card { max-height: none; }
  .lrow, .lrow.e, .lrow.l5, .lrow.e5, .lrow.x, .lrow.xr { grid-template-columns: 40px minmax(0, 1fr); }
  .lrow > :nth-child(n+3) { grid-column: 2; }
  .lrow.head { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<div class="app">
  <aside class="side">
    <div class="side-head">
      <h1>Проект приказа об изменениях ФОП</h1>
      <p id="docmeta"></p>
      <div class="search">
        <input id="q" type="search" placeholder="Код, текст или ID: «2.4», «Хаммурапи», «полураспад»" autocomplete="off" aria-label="Поиск по пунктам">
        <kbd>/</kbd>
      </div>
      <div class="legend"><span><span class="chip ok">размечено</span> история и физика — построчно, остальные предметы — до таблиц</span><span><span class="chip">7 ч</span> вес элемента по урокам; уроки физики — из <span class="chip cons">Конструктора</span>, в приказе их нет</span></div>
    </div>
    <div class="tree" id="tree" role="tree"></div>
    <div class="results" id="results" hidden></div>
  </aside>

  <main class="main">
    <div class="tabs">
      <button class="tab" id="tab-doc" type="button" aria-pressed="true">Документ</button>
      <button class="tab" id="tab-links" type="button" aria-pressed="false">Связи: урок → элемент → ОГЭ/ЕГЭ</button>
      <button class="tab theme" id="theme" type="button"></button>
    </div>
    <section class="card" id="card" aria-live="polite"></section>
    <div class="toolbar" id="toolbar">
      <button class="btn" id="prev" title="Предыдущая страница (←)">← стр.</button>
      <input class="pgin" id="pgin" inputmode="numeric" aria-label="Номер страницы">
      <span class="pg" id="pgof"></span>
      <button class="btn" id="next" title="Следующая страница (→)">стр. →</button>
      <button class="btn" id="zout" title="Мельче">−</button>
      <button class="btn" id="zfit" title="По ширине">по ширине</button>
      <button class="btn" id="zin" title="Крупнее">+</button>
      <span class="chip docname" id="docname"></span>
      <span class="status" id="status"></span>
    </div>
    <div class="viewer" id="viewer">
      <div class="loading" id="loading">
        <strong id="loadtitle">Открываю приказ…</strong>
        <div class="bar"><i id="barfill"></i></div>
        <span id="loadtxt" class="pg"></span>
      </div>
      <div class="sheet" id="sheet" hidden><canvas id="cv"></canvas><div id="ov"></div></div>
    </div>
    <section class="links" id="links" hidden></section>
  </main>

 своё отношение к ним","pg":459,"ty":"requirement","v":"различать","p":"OOO.history.cls.g8.req.7","re":["OOO.history.oge.req.8"],"rm":"rule"},{"i":"OOO.history.cls.g8.req.7.3","c":"7.3","x":"Определять и аргументировать собственную или предложенную точку зрения на события и личностей отечественной и всеобщей ис- тории XVIII в. с опорой на фактический материал, в том числе используя источники разных типов","pg":459,"ty":"requirement","v":"определять","p":"OOO.history.cls.g8.req.7","re":["OOO.history.oge.req.8"],"rm":"rule"},{"i":"OOO.history.cls.g8.req.8","c":"8","x":"Применение исторических знаний","pg":459,"ty":"requirement","ig":1},{"i":"OOO.history.cls.g8.req.8.1","c":"8.1","x":"Раскрывать (объяснять), как сочетались в памятниках культуры России XVIII в. европейские влияния и национальные традиции, показывать на примерах","pg":459,"ty":"requirement","v":"раскрывать","p":"OOO.history.cls.g8.req.8","re":["OOO.history.oge.req.2","OOO.history.oge.req.14"],"rm":"manual"},{"i":"OOO.history.cls.g8.req.8.2","c":"8.2","x":"Выполнять учебные проекты по отечественной и всеобщей истории XVIII в. (в том числе на региональном материале)","pg":459,"ty":"requirement","v":"выполнять","p":"OOO.history.cls.g8.req.8","re":[],"rm":"rule","rn":"учебные проекты — в требованиях ОГЭ нет"},{"i":"OOO.history.cls.g8.req.8.3","c":"8.3","x":"Использовать исторические понятия для решения учебных и практических задач","pg":459,"ty":"requirement","v":"использовать","p":"OOO.history.cls.g8.req.8","re":["OOO.history.oge.req.3"],"rm":"rule"},{"i":"OOO.history.cls.g8.req.8.4","c":"8.4","x":"Осуществлять поиск исторической информации по отечественной и всеобщей истории XVIII в. в справочной литературе, информа- ционно-телекоммуникационной сети «Интернет» для решения познавательных задач, оценивать полноту и верифицированность информации","pg":460,"ty":"requirement","v":"осуществлять","p":"OOO.history.cls.g8.req.8","re":["OOO.history.oge.req.13"],"rm":"rule"}],"n":41},{"i":"OOO.history.cls.g8.el","t":"table","l":"Элементы содержания · 8 класс","s":"табл. 4.2","pg":460,"pe":466,"sn":["Таблица 4.2"],"r":[{"i":"OOO.history.cls.g8.el.1","c":"1","x":"Всеобщая история. История Нового времени. XVIII в.","pg":460,"ty":"element","ig":1,"wh":22.0,"ws":34.92,"wl":[],"wr":["OOO.history.les.g8.23"]},{"i":"OOO.history.cls.g8.el.1.1","c":"1.1","x":"Век Просвещения. Истоки европейского Просвещения. Достижения естественных наук и распространение идей рационализма. Английское Просвещение; Дж. Локк и Т. Гоббс. Секуляризация (обмирщение) сознания. Культ Разума. Франция ‒ центр Просвещения. Философские и политические идеи Ф.М. Вольтера, Ш.Л. Монтескье, Ж.Ж. Руссо. «Энциклопедия» (Д. Дидро, Ж. Д’Аламбер). Германское Просве- щение. Распространение идей Просвещения в Америке. Влияние просветителей на изменение представлений об отношениях власти и общества. «Союз королей и философов»","pg":460,"ty":"element","p":"OOO.history.cls.g8.el.1","xe":["OOO.history.oge.el.5.13"],"xm":"manual","wh":3.0,"ws":4.76,"wl":["OOO.history.les.g8.1","OOO.history.les.g8.2","OOO.history.les.g8.3"],"wr":[]},{"i":"OOO.history.cls.g8.el.1.2","c":"1.2","x":"Государства Европы в XVIII в. Монархии в Европе XVIII в.: абсолютные и парламентские монархии. Просвещённый абсолютизм: правители, идеи, практика. Политика в отношении сословий: старые порядки и новые веяния. Государство и Церковь. Секуляризация церковных земель. Экономическая политика власти. Меркантилизм","pg":460,"ty":"element","p":"OOO.history.cls.g8.el.1","xe":["OOO.history.oge.el.5.13"],"xm":"auto","wh":1.0,"ws":1.59,"wl":["OOO.history.les.g8.4"],"wr":[]},{"i":"OOO.history.cls.g8.el.1.3","c":"1.3","x":"Великобритания в XVIII в. Королевская власть и парламент. Тори и виги. Предпосылки промышленного переворота в Англии. Технические изобретения и создание первых машин. Появление фабрик, замена ручного труда машинным. Социальные и экономические последствия промышленного переворота. Условия труда и быта фабричных рабочих. Движения протеста. Луддизм","pg":460,"ty":"element","p":"OOO.history.cls.g8.el.1","xe":["OOO.history.oge.el.5.13"],"xm":"auto","wh":2.0,"ws":3.17,"wl":["OOO.history.les.g8.5","OOO.history.les.g8.6"],"wr":[]},{"i":"OOO.history.cls.g8.el.1.4","c":"1.4","x":"Франция. Абсолютная монархия: политика сохранения старого порядка. Попытки проведения реформ. Королевская власть и сословия","pg":460,"ty":"element","p":"OOO.history.cls.g8.el.1","xe":["OOO.history.oge.el.5.13"],"xm":"auto","wh":1.0,"ws":1.59,"wl":["OOO.history.les.g8.7"],"wr":[]},{"i":"OOO.history.cls.g8.el.1.5","c":"1.5","x":"Германские государства, монархия Габсбургов, итальянские земли в XVIII в. Раздробленность Германии. Возвышение Пруссии. Фридрих II Великий. Габсбургская монархия в XVIII в. Правление Марии Терезии и Иосифа II. Реформы просвещённого абсолютизма. Итальянские государства: политическая раздробленность. Усиление власти Габсбургов над частью итальянских земель","pg":460,"ty":"element","p":"OOO.history.cls.g8.el.1","xe":["OOO.history.oge.el.5.13"],"xm":"auto","wh":1.0,"ws":1.59,"wl":["OOO.history.les.g8.8"],"wr":[]},{"i":"OOO.history.cls.g8.el.1.6","c":"1.6","x":"Государства Пиренейского полуострова. Испания: проблемы внутреннего развития, ослабление международных позиций. Реформы в правление Карла III. Попытки проведения реформ в Португалии. Управление колониальными владениями Испании и Португалии в Южной Америке. Недовольство населения колоний политикой метрополий","pg":460,"ty":"element","p":"OOO.history.cls.g8.el.1","f":["spans_pages"],"xe":["OOO.history.oge.el.5.15"],"xm":"manual","wh":1.0,"ws":1.59,"wl":["OOO.history.les.g8.9"],"wr":[]},{"i":"OOO.history.cls.g8.el.1.7","c":"1.7","x":"Британские колонии в Северной Америке: борьба за независимость. Создание английских колоний на американской земле. Состав европейских переселенцев. Складывание местного самоуправления. Колонисты и индейцы. Южные и северные колонии: особенности экономического развития и социальных отношений. Противоречия между метрополией и колониями. «Бостонское чаепитие». Первый Континентальный конгресс (1774) и начало Войны за независимость. Первые сражения войны. Создание регулярной армии под коман- дованием Дж. Вашингтона. Принятие Декларации независимости (1776). Перелом в войне и её завершение. Поддержка колонистов со стороны России. Итоги Войны за независимость. Конституция (1787). «Отцы-основатели». Билль о правах (1791). Значение завоевания североамериканскими штатами независимости","pg":461,"ty":"element","p":"OOO.history.cls.g8.el.1","xe":["OOO.history.oge.el.5.14"],"xm":"auto","wh":2.0,"ws":3.17,"wl":["OOO.history.les.g8.10","OOO.history.les.g8.11"],"wr":[]},{"i":"OOO.history.cls.g8.el.1.8","c":"1.8","x":"Французская революция конца XVIII в. Причины революции. Хронологические рамки и основные этапы революции. Начало революции. Декларация прав человека и гражданина. Политические течения и деятели революции (Ж.Ж. Дантон, Ж.-П. Марат). Упразднение монархии и провозглашение республики. Вареннский кризис. Начало войн против европейских монархов. Казнь короля. Вандея. Политическая борьба в годы республики. Конвент и «революционный порядок управления». Комитет общественного спасения. М. Робеспьер. Террор. Отказ от основ «старого мира»: культ разума, борьба против церкви, новый календарь. Термидорианский переворот (27 июля 1794 г.). Учреждение Директории. Наполеон Бонапарт. Государственный переворот 18–19 брюмера (ноябрь 1799 г.). Установление режима консульства. Итоги и значение революции","pg":461,"ty":"element","p":"OOO.history.cls.g8.el.1","xe":["OOO.history.oge.el.5.13"],"xm":"manual","wh":3.0,"ws":4.76,"wl":["OOO.history.les.g8.12","OOO.history.les.g8.13","OOO.history.les.g8.14"],"wr":[]},{"i":"OOO.history.cls.g8.el.1.9","c":"1.9","x":"Европейская культура в XVIII в. Развитие науки. Новая картина мира в трудах математиков, физиков, астрономов. Достижения в естественных науках и медицине. Продолжение географических открытий. Распространение образования. Литература XVIII в.: жанры, писатели, великие романы. Художественные стили: классицизм, барокко, рококо. Музыка духовная и светская. Театр: жанры, популярные авторы, произведения. Сословный характер культуры. Повседневная жизнь обитателей городов и деревень","pg":461,"ty":"element","p":"OOO.history.cls.g8.el.1","xe":["OOO.history.oge.el.5.20"],"xm":"auto","wh":3.0,"ws":4.76,"wl":["OOO.history.les.g8.15","OOO.history.les.g8.16","OOO.history.les.g8.17"],"wr":[]},{"i":"OOO.history.cls.g8.el.1.10","c":"1.10","x":"Международные отношения в XVIII в. Проблемы европейского баланса сил и дипломатия. Участие России в международных отношениях в XVIII в. Северная война (1700– 1721). Династические войны «за наследство». Семилетняя война (1756–1763). Разделы Речи Посполитой. Войны антифранцузских коалиций против революционной Франции. Колониальные захваты европейских держав","pg":461,"ty":"element","p":"OOO.history.cls.g8.el.1","xe":["OOO.history.oge.el.5.14"],"xm":"auto","wh":2.0,"ws":3.17,"wl":["OOO.history.les.g8.18","OOO.history.les.g8.19"],"wr":[]},{"i":"OOO.history.cls.g8.el.1.11","c":"1.11","x":"Страны Востока в XVIII в. Османская империя: от могущества к упадку. Положение населения. Попытки проведения реформ; Селим III. Индия. Ослабление империи Великих Моголов. Борьба европейцев за владения в Индии. Утверждение британского владычества. Китай. Империя Цин в XVIII в.: власть маньчжурских императоров, система управления страной. Внешняя политика империи Цин; отношения с Россией. «Закрытие» Китая для иноземцев. Япония в XVIII в. Сёгуны и даймё. Положение сословий. Культура стран Востока в XVIII в. Историческое и культурное наследие XVIII в.","pg":462,"ty":"element","p":"OOO.history.cls.g8.el.1","xe":["OOO.history.oge.el.5.15"],"xm":"manual","wh":3.0,"ws":4.76,"wl":["OOO.history.les.g8.20","OOO.history.les.g8.21","OOO.history.les.g8.22"],"wr":[]},{"i":"OOO.history.cls.g8.el.2","c":"2","x":"Россия в эпоху преобразований Петра I","pg":462,"ty":"element","ig":1,"wh":11.0,"ws":17.46,"wl":[],"wr":["OOO.history.les.g8.35"]},{"i":"OOO.history.cls.g8.el.2.1","c":"2.1","x":"Причины и предпосылки преобразований. Россия и Европа в конце XVII в. Модернизация как жизненно важная национальная задача. Начало царствования Петра I, борьба за власть. Правление царевны Софьи. Стрелецкие бунты. Хованщина. Первые шаги на пути преобразований. Сподвижники Петра I. Азовские походы. Великое посольство и его значение","pg":462,"ty":"element","p":"OOO.history.cls.g8.el.2","xe":["OOO.history.oge.el.3.1"],"xm":"auto","xd":["SOO.history.ege.el.1-6"],"wh":3.0,"ws":4.76,"wl":["OOO.history.les.g8.24","OOO.history.les.g8.25","OOO.history.les.g8.26"],"wr":[]},{"i":"OOO.history.cls.g8.el.2.2","c":"2.2","x":"Экономическая политика. Строительство заводов и мануфактур. Создание базы металлургической индустрии на Урале. Оружейные заводы и корабельные верфи. Роль государства в создании промышленности. Преобладание крепостного и подневольного труда. Принципы меркантилизма и протекционизма. Таможенный тариф 1724 г. Введение подушной подати","pg":462,"ty":"element","p":"OOO.history.cls.g8.el.2","xe":["OOO.history.oge.el.3.1"],"xm":"auto","xd":["SOO.history.ege.el.1-6"],"wh":1.0,"ws":1.59,"wl":["OOO.history.les.g8.27"],"wr":[]},{"i":"OOO.history.cls.g8.el.2.3","c":"2.3","x":"Социальная политика. Консолидация дворянского сословия, повышение его роли в управлении страной. Указ о единонаследии и Табель о рангах. Противоречия в политике по отношению к купечеству и городским сословиям: расширение их прав в местном управлении и усиление налогового гнёта. Положение крестьян. Переписи населения (ревизии)","pg":462,"ty":"element","p":"OOO.history.cls.g8.el.2","xe":["OOO.history.oge.el.3.1"],"xm":"auto","xd":["SOO.history.ege.el.1-6"],"wh":1.0,"ws":1.59,"wl":["OOO.history.les.g8.28"],"wr":[]},{"i":"OOO.history.cls.g8.el.2.4","c":"2.4","x":"Реформы управления. Реформы местного управления (бурмистры и Ратуша), городская и областная (губернская) реформы. Сенат, коллегии, органы надзора и суда. Усиление централизации и бюрократизации управления. Генеральный регламент. Санкт- Петербург ‒ новая столица. Первые гвардейские полки. Создание регулярной армии, военного флота. Рекрутские наборы","pg":462,"ty":"element","p":"OOO.history.cls.g8.el.2","xe":["OOO.history.oge.el.3.1"],"xm":"auto","xd":["SOO.history.ege.el.1-6"],"wh":2.0,"ws":3.17,"wl":["OOO.history.les.g8.29","OOO.history.les.g8.30"],"wr":[]},{"i":"OOO.history.cls.g8.el.2.5","c":"2.5","x":"Церковная реформа. Упразднение патриаршества, учреждение Синода. Положение инославных конфессий","pg":462,"ty":"element","p":"OOO.history.cls.g8.el.2","xe":["OOO.history.oge.el.3.1"],"xm":"auto","xd":["SOO.history.ege.el.1-6"],"wh":1.0,"ws":1.59,"wl":["OOO.history.les.g8.31"],"wr":[]},{"i":"OOO.history.cls.g8.el.2.6","c":"2.6","x":"Оппозиция реформам Петра I. Социальные движения в первой четверти XVIII в. Восстания в Астрахани, Башкирии, на Дону. Дело царевича Алексея","pg":462,"ty":"element","p":"OOO.history.cls.g8.el.2","xe":["OOO.history.oge.el.3.1"],"xm":"auto","xd":["SOO.history.ege.el.1-6"],"wh":1.0,"ws":1.59,"wl":["OOO.history.les.g8.32"],"wr":[]},{"i":"OOO.history.cls.g8.el.2.7","c":"2.7","x":"Внешняя политика. Северная война. Причины и цели войны. Неудачи в начале войны и их преодоление. Битва при д. Лесной и победа под Полтавой. Прутский поход. Борьба за гегемонию на Балтике. Сражения у м. Гангут и о. Гренгам. Ништадтский мир и его последствия. Закрепление России на берегах Балтики. Провозглашение России империей. Каспийский поход Петра I","pg":462,"ty":"element","p":"OOO.history.cls.g8.el.2","f":["spans_pages"],"xe":["OOO.history.oge.el.3.2"],"xm":"manual","xd":["SOO.history.ege.el.1-6"],"wh":1.0,"ws":1.59,"wl":["OOO.history.les.g8.33"],"wr":[]},{"i":"OOO.history.cls.g8.el.2.8","c":"2.8","x":"Преобразования Петра I в области культуры. Доминирование светского начала в культурной политике. Влияние культуры стран зарубежной Европы. Привлечение иностранных специалистов. Введение нового летоисчисления, гражданского шрифта и гражданской печати. Первая газета «Ведомости». Создание сети школ и специальных учебных заведений. Развитие науки. Открытие Академии наук в Петербурге. Кунсткамера. Светская живопись, портрет петровской эпохи. Скульптура и архитектура. Памятники раннего барокко. Повседневная жизнь и быт правящей элиты и основной массы населения. Перемены в образе жизни российского дворянства. «Юности честное зерцало». Новые формы общения в дворянской среде. Ассамблеи, балы, светские государственные праздники. Европейский стиль в одежде, развлечениях, питании. Изменения в положении женщин. Итоги, последствия и значение петровских преобразований. Образ Петра I в русской культуре","pg":463,"ty":"element","p":"OOO.history.cls.g8.el.2","xe":["OOO.history.oge.el.3.8"],"xm":"manual","xd":["SOO.history.ege.el.1-6"],"wh":1.0,"ws":1.59,"wl":["OOO.history.les.g8.34"],"wr":[]},{"i":"OOO.history.cls.g8.el.3","c":"3","x":"Россия после Петра I. Дворцовые перевороты","pg":463,"ty":"element","ig":1,"wh":6.0,"ws":9.52,"wl":[],"wr":["OOO.history.les.g8.42"]},{"i":"OOO.history.cls.g8.el.3.1","c":"3.1","x":"Причины нестабильности политического строя. Дворцовые перевороты. Фаворитизм. Создание Верховного тайного совета","pg":463,"ty":"element","p":"OOO.history.cls.g8.el.3","xe":["OOO.history.oge.el.3.3"],"xm":"auto","xd":["SOO.history.ege.el.1-6"],"wh":1.0,"ws":1.59,"wl":["OOO.history.les.g8.36"],"wr":[]},{"i":"OOO.history.cls.g8.el.3.2","c":"3.2","x":"Крушение политической карьеры А.Д. Меншикова. Кондиции «верховников» и приход к власти Анны Иоанновны. Кабинет министров. Роль Э. Бирона, А.И. Остермана, А.П. Волынского, Б.Х. Миниха в управлении и политической жизни страны","pg":463,"ty":"element","p":"OOO.history.cls.g8.el.3","xe":["OOO.history.oge.el.3.3"],"xm":"auto","xd":["SOO.history.ege.el.1-6"],"wh":1.0,"ws":1.59,"wl":["OOO.history.les.g8.37"],"wr":[]},{"i":"OOO.history.cls.g8.el.3.3","c":"3.3","x":"Укрепление границ империи на восточной и юго-восточной окраинах. Переход Младшего жуза под суверенитет Российской империи. Война с Османской империе о. Губернская реформа. Жалованные грамоты дворянству и городам. Положение сословий. Дворянство ‒ «первенствующее сословие» империи. Привлечение представителей сословий к местному управлению. Создание дворянских обществ в губерниях и уездах. Расширение привилегий гильдейского купечества в налоговой сфере и городском управлении","pg":463,"ty":"element","p":"OOO.history.cls.g8.el.4","f":["spans_pages"],"xe":["OOO.history.oge.el.3.4"],"xm":"auto","xd":["SOO.history.ege.el.1-6"],"wh":5.0,"ws":7.94,"wl":["OOO.history.les.g8.43","OOO.history.les.g8.44","OOO.history.les.g8.45","OOO.history.les.g8.46","OOO.history.les.g8.47"],"wr":[]},{"i":"OOO.history.cls.g8.el.4.2","c":"4.2","x":"Национальная политика и народы России в XVIII в. Унификация управления на окраинах империи. Ликвидация гетманства на Левобережной Украине и Войска Запорожского. Формирование Кубанского казачества. Активизация деятельности по привлечению иностранцев в Россию. Расселение колонистов в Новороссии, Поволжье, других регионах. Укрепление веротерпимости по отноше- нию к неправославным и нехристианским конфессиям. Политика по отношению к исламу. Башкирские восстания. Формирование черты оседлости","pg":464,"ty":"element","p":"OOO.history.cls.g8.el.4","xe":["OOO.history.oge.el.3.6"],"xm":"manual","xd":["SOO.history.ege.el.1-6"],"wh":1.0,"ws":1.59,"wl":["OOO.history.les.g8.48"],"wr":[]},{"i":"OOO.history.cls.g8.el.4.3","c":"4.3","x":"Экономическое развитие России во второй половине XVIII в. Крестьяне: крепостные, государственные, монастырские. Условия жизни крепостной деревни. Права помещика по отношению к своим крепостным. Барщинное и оброчное хозяйство. Дворовые люди. Роль крепостного строя в экономике страны. Промышленность в городе и деревне. Роль государства, купечества, помещиков в развитии промышленности. Крепостной и вольнонаёмный труд. Привлечение крепостных оброчных крестьян к работе на мануфактурах. Развитие крестьянских промыслов. Рост текстильной промышленности: распространение производства хлопчатобумажных тканей. Начало известных предпринимательских династий: Морозовы, Рябушинские, Гарелины, Прохоровы, Демидовы и другие. Внутренняя и внешняя торговля. Торговые пути внутри страны. Водно-транспортные системы: Вышневолоцкая, Тихвинская, Мариинская и другие ярмарки и их роль во внутренней торговле. Макарьевская, Ирбитская, Свенская, Коренная ярмарки. Ярмарки Малороссии. Партнёры России во внешней торговле в Европе и в мире. Обеспечение активного внешнеторгового баланса","pg":464,"ty":"element","p":"OOO.history.cls.g8.el.4","xe":["OOO.history.oge.el.3.4"],"xm":"auto","xd":["SOO.history.ege.el.1-6"],"wh":3.0,"ws":4.76,"wl":["OOO.history.les.g8.49","OOO.history.les.g8.50","OOO.history.les.g8.51"],"wr":[]},{"i":"OOO.history.cls.g8.el.4.4","c":"4.4","x":"Обострение социальных противоречий. Чумной бунт в Москве. Восстание под предводительством Емельяна Пугачёва. Антидворянский и антикрепостнический характер движения. Роль казачества, народов Урала и Поволжья в восстании. Влияние восстания на внутреннюю политику и развитие общественной мысли","pg":464,"ty":"element","p":"OOO.history.cls.g8.el.4","xe":["OOO.history.oge.el.3.4"],"xm":"auto","xd":["SOO.history.ege.el.1-6"],"wh":2.0,"ws":3.17,"wl":["OOO.history.les.g8.52","OOO.history.les.g8.53"],"wr":[]},{"i":"OOO.history.cls.g8.el.4.5","c":"4.5","x":"Внешняя политика России второй половины XVIII в., её основные задачи. Н.И. Панин и А.А. Безбородко. Борьба России за выход к Чёрному морю. Войны с Османской империей. П.А. Румянцев, А.В. Суворов, Ф.Ф. Ушаков, победы российских войск под их руководством. Присоединение Крыма и Северного Причерноморья. Организация управления Новороссией. Строительство новых городов и портов. Основание Пятигорска, Севастополя, Одессы, Херсона. Г.А. Потемкин. Путешествие Екатерины II на юг в 1787 г. Участие России в разделах Речи Посполитой. Политика России в Польше до начала 1770-х гг.: стремление к усилению российского влияния в условиях сохранения польского государства. Участие России в разделах Польши вместе с империей Габсбургов и Пруссией. Первый, второй и третий разделы. Борьба поляков за национальную независимость. Восстание под предводительством Т. Костюшко","pg":464,"ty":"element","p":"OOO.history.cls.g8.el.4","f":["spans_pages"],"xe":["OOO.history.oge.el.3.5"],"xm":"manual","xd":["SOO.history.ege.el.1-6"],"wh":3.0,"ws":4.76,"wl":["OOO.history.les.g8.54","OOO.history.les.g8.55","OOO.history.les.g8.56"],"wr":[]},{"i":"OOO.history.cls.g8.el.4.6","c":"4.6","x":"Россия при Павле I. Личность Павла I и её влияние на политику страны. Основные принципы внутренней политики. Ограничение дворянских привилегий. Укрепление абсолютизма через отказ от принципов «просвещённого абсолютизма» и усиление бюрократического и полицейского характера государства и личной власти императора. Акт о престолонаследии и Манифест о «трёх- дневной барщине». Политика по отношению к дворянству, взаимоотношения со столичной знатью. Меры в области внешней политики. Причины дворцового переворота 11 марта 1801 г.","pg":465,"ty":"element","p":"OOO.history.cls.g8.el.4","xe":["OOO.history.oge.el.3.7"],"xm":"manual","xd":["SOO.history.ege.el.1-6"],"wh":2.5,"ws":3.97,"wl":["OOO.history.les.g8.57","OOO.history.les.g8.58","OOO.history.les.g8.59"],"wr":[]},{"i":"OOO.history.cls.g8.el.4.7","c":"4.7","x":"Участие России в борьбе с революционной Францией. Итальянский и Швейцарский походы А.В. Суворова. Действия эскадры Ф.Ф. Ушакова в Средиземном море","pg":465,"ty":"element","p":"OOO.history.cls.g8.el.4","xe":["OOO.history.oge.el.3.7"],"xm":"manual","xd":["SOO.history.ege.el.1-6"],"wh":0.5,"ws":0.79,"wl":["OOO.history.les.g8.59"],"wr":[]},{"i":"OOO.history.cls.g8.el.4.8","c":"4.8","x":"Культурное пространство Российской империи в XVIII в. Идеи Просвещения в российской общественной мысли, публицистике и литературе. Литература народов России в XVIII в. Первые журналы. Общественные идеи в произведениях А.П. Сумарокова, Г.Р. Державина, Д.И. Фонвизина. Н.И. Новиков, материалы о положении крепостных крестьян в его журналах. А.Н. Радищев и его «Путешествие из Петербурга в Москву». Русская культура и культура народов России в XVIII в. Развитие новой светской культуры после преобразований Петра I. Укрепление взаимосвязей с культурой стран зарубежной Европы. Масонство в России. Распространение в России основных стилей и жанров европейской художественной культуры (барокко, классицизм, роко- ко). Вклад в развитие русской культуры учёных, художников, мастеров, прибывших из-за рубежа. Усиление внимания к жизни и культуре русского народа и историческому прошлому России к концу столетия. Культура и быт российских сословий. Дворянство: жизнь и быт дворянской усадьбы. Духовенство. Купечество. Крестьянство. Русская архитектура XVIII в. Строительство Петербурга, формирование его городского плана. Регулярный характер застройки Петербурга и других городов. Барокко в архитектуре Москвы и Петербурга. Переход к классицизму, создание архитектурных ансамблей в стиле классицизма в обеих столицах. В.И. Баженов, М.Ф. Казаков, Ф.Ф. Растрелли. Изобразительное искусство в России, его выдающиеся мастера и произведения. Академия художеств в Петербурге. Расцвет жанра парадного портрета в середине XVIII в. Новые веяния в изобразительном искусстве в конце столетия","pg":465,"ty":"element","p":"OOO.history.cls.g8.el.4","f":["spans_pages"],"xe":["OOO.history.oge.el.3.8"],"xm":"manual","xd":["SOO.history.ege.el.1-6"],"wh":4.0,"ws":6.35,"wl":["OOO.history.les.g8.61","OOO.history.les.g8.62","OOO.history.les.g8.63","OOO.history.les.g8.66"],"wr":[]},{"i":"OOO.history.cls.g8.el.4.9","c":"4.9","x":"Российская наука в XVIII в. Академия наук в Петербурге. Изучение страны ‒ главная задача российской науки. Географические экспедиции. Вторая Камчатская экспедиция. Освоение Аляски и Северо-Западного побережья Америки. Российско-американская компания. Исследования в области отечественной истории. Изучение российской словесности и развитие русского литературного языка. Российская академия. Е.Р. Дашкова. М.В. Ломоносов и его роль в становлении российской науки и образования. Образование в России в XVIII в. Основные педагогические идеи. Воспитание «новой породы» людей. Основание воспитательных домов в Санкт- Петербурге и Москве, Института благородных девиц в Смольном монастыре. Сословные учебные заведения для юношества из дворянства. Московский университет ‒ первый российский университет","pg":466,"ty":"element","p":"OOO.history.cls.g8.el.4","xe":["OOO.history.oge.el.3.8"],"xm":"manual","xd":["SOO.history.ege.el.1-6"],"wh":2.0,"ws":3.17,"wl":["OOO.history.les.g8.64","OOO.history.les.g8.65"],"wr":[]},{"i":"OOO.history.cls.g8.el.5","c":"5","x":"Наш край в XVIII в.","pg":466,"ty":"element","xe":[],"xm":"region","wh":1.0,"ws":1.59,"wl":["OOO.history.les.g8.67"],"wr":[]}],"n":39},{"i":"OOO.history.cls.g9.req","t":"table","l":"Требования · 9 класс","s":"табл. 5.1","pg":466,"pe":469,"sn":["Таблица 5.1"],"r":[{"i":"OOO.history.cls.g9.req.1","c":"1","x":"Знание хронологии, работа с хронологией","pg":466,"ty":"requirement","ig":1},{"i":"OOO.history.cls.g9.req.1.1","c":"1.1","x":"Называть даты (хронологические границы) важнейших событий и процессов отечественной и всеобщей истории XIX ‒ начала XX в.; выделять этапы (периоды) в развитии ключевых событий и процессов","pg":466,"ty":"requirement","v":"называть","p":"OOO.history.cls.g9.req.1","re":["OOO.history.oge.req.1"],"rm":"rule"},{"i":"OOO.history.cls.g9.req.1.2","c":"1.2","x":"Выявлять синхронность (асинхронность) исторических процессов отечественной и всеобщей истории XIX ‒ начала XX в.","pg":466,"ty":"requirement","v":"выявлять","p":"OOO.history.cls.g9.req.1","re":["OOO.history.oge.req.1"],"rm":"rule"},{"i":"OOO.history.cls.g9.req.1.3","c":"1.3","x":"Определять последовательность событий, явлений, процессов отечественной и всеобщей истории XIX ‒ начала XX в., в том числе на основе анализа причинно-следственных связей","pg":466,"ty":"requirement","v":"определять","p":"OOO.history.cls.g9.req.1","re":["OOO.history.oge.req.1"],"rm" ии, Португалии, Испании. Экономические кризисы 1970-х – начала 1980-х гг. Неоконсерватизм. Европейский союз","pg":1107,"ty":"element","p":"SOO.history.cls.g11.el.1","g":"ВСЕОБЩАЯ ИСТОРИЯ","xe":["SOO.history.ege.el.12.1"],"xm":"auto","wh":1.5,"ws":2.42,"wl":["SOO.history.les.g11.3","SOO.history.les.g11.4","SOO.history.les.g11.5"],"wr":[]},{"i":"SOO.history.cls.g11.el.1.4","c":"1.4","x":"Страны Центральной и Восточной Европы во второй половине ХХ – начале XXI в. Революции второй половины 1940-х гг. и установление коммуни- стических режимов. СЭВ и ОВД. Достижения и проблемы социалистического развития в 1950-е гг. Выступления в ГДР (1953), Польше и Венгрии (1956). Югославская модель социализма. «Пражская весна» 1968 г. и её подавление. Движение «Солидарность» в Польше. Перестройка в СССР и страны Восточного блока. Революции 1989–1990 гг. в странах Центральной и Восточной Европы. Распад ОВД, СЭВ. Образование новых государств на постсоветском пространстве. Разделение Чехословакии. Распад Югославии и война на Балканах. Агрессия НАТО против Югославии. Развитие восточноевропейских государств в XXI в. (экономика, политика, внешнеполитическая ориентация, участие в интеграционных процессах)","pg":1107,"ty":"element","p":"SOO.history.cls.g11.el.1","g":"ВСЕОБЩАЯ ИСТОРИЯ","xe":["SOO.history.ege.el.12.1"],"xm":"auto","wh":2.0,"ws":3.23,"wl":["SOO.history.les.g11.6","SOO.history.les.g11.7"],"wr":[]},{"i":"SOO.history.cls.g11.el.2","c":"2","x":"Страны Азии, Африки и Латинской Америки во второй половине ХХ – на- чале XXI в.: проблемы и пути модернизации. Обретение независимости и выбор путей развития странами Азии и Африки","pg":1107,"ty":"element","g":"ВСЕОБЩАЯ ИСТОРИЯ","ig":1,"wh":7.0,"ws":11.29,"wl":[],"wr":["SOO.history.les.g11.15","SOO.history.les.g11.23"]},{"i":"SOO.history.cls.g11.el.2.1","c":"2.1","x":"Страны Восточной, Юго-Восточной и Южной Азии. Освободительная борьба и провозглашение национальных государств в регионе. Китай: провозглашение республики; социалистический экспе "pe":1495,"sn":["Таблица 3.1"]},{"i":"NOO.env.cls.g3.el","t":"table","l":"Элементы содержания · 3 класс","s":"табл. 3.2","pg":1495,"pe":1497,"sn":["Таблица 3.2"]},{"i":"NOO.env.cls.g4.req","t":"table","l":"Требования · 4 класс","s":"табл. 4.1","pg":1497,"pe":1499,"sn":["Таблица 4.1"]},{"i":"NOO.env.cls.g4.el","t":"table","l":"Элементы содержания · 4 класс","s":"табл. 4.2","pg":1499,"pe":1501,"sn":["Таблица 4.2"]}]}]},{"i":"NOO.technology","t":"subj","l":"Технология (труд)","pg":1501,"pe":1512,"parsed":0,"c":[{"i":"NOO.technology.les@167.11","t":"block","l":"Поурочное планирование","s":"п. 167.11","pg":1501,"pe":1512,"sn":["167.11 Поурочное"],"c":[{"i":"NOO.technology.les.g1","t":"table","l":"1 класс · уроки","s":"","pg":1501,"pe":1502,"sn":["1 класс"]},{"i":"NOO.technology.les.g2","t":"table","l":"2 класс · уроки","s":"","pg":1502,"pe":1504,"sn":["2 класс"]},{"i":"NOO.technology.les.g3","t":"table","l":"3 класс · уроки","s":"","pg":1504,"pe":1512,"sn":["3 класс"]}]}]}]}]}</script>

<script>
(function () {
  "use strict";
  const DATA = JSON.parse(document.getElementById("data").textContent);
  const encPath = p => p.split("/").map(encodeURIComponent).join("/");
  const DOCS = {
    order: { url: "../" + encPath("источники/Проект приказа 2.pdf"), name: "Проект приказа", file: "Проект приказа 2.pdf" },
    c79: { url: "../" + encPath("1_разметка/физика_поурочное/источники/Конструктор_Физика_7-9_база_ID12372761.pdf"), name: "Конструктор: Физика 7–9 (ID 12372761)", file: "Конструктор_Физика_7-9_база_ID12372761.pdf" },
    c1011: { url: "../" + encPath("1_разметка/физика_поурочное/источники/Конструктор_Физика_10-11_база_ID12372794.pdf"), name: "Конструктор: Физика 10–11 (ID 12372794)", file: "Конструктор_Физика_10-11_база_ID12372794.pdf" },
  };
  const DEFAULT_ID = "OOO.history.cls.g5.el.2.4";

  // ---------- модель
  const nodes = new Map(), parent = new Map(), recKids = new Map();
  function walk(n, p) {
    nodes.set(n.i, n);
    if (p) parent.set(n.i, p.i);
    (n.c || []).forEach(ch => walk(ch, n));
    (n.r || []).forEach(r => { r.t = "rec"; nodes.set(r.i, r); parent.set(r.i, n.i); });
  }
  DATA.tree.forEach(n => walk(n, null));
  nodes.forEach(n => { if (n.t === "rec" && n.p) { if (!recKids.has(n.p)) recKids.set(n.p, []); recKids.get(n.p).push(n.i); } });
  const ancestors = id => { const out = []; let p = parent.get(id); while (p) { out.unshift(p); p = parent.get(p); } return out; };
  const srcOf = n => { if (!n) return "order"; if (n.src) return n.src; for (const a of ancestors(n.i).reverse()) { const A = nodes.get(a); if (A && A.src) return A.src; } return "order"; };
  const isCons = n => srcOf(n) !== "order";

  const TYPE_RU = { lesson: "Урок", requirement: "Требование к результатам", element: "Элемент содержания",
    exam_requirement: "Требование экзамена", exam_element: "Элемент содержания экзамена", theme: "Тема (тематическое планирование ФРП)", unknown: "Строка таблицы" };
  const LT = { lab: ["лабораторная / исследование", "lab"], mixed: ["теория + лабораторная", "lab"], problems: ["решение задач", ""], conference: ["урок-конференция", ""], control: ["контрольная", "rev"], review: ["повторение", "rev"], reserve: ["резервный", "rev"] };
  const FLAG_RU = { formula_suspect: "формулы извлечены с искажениями — сверяй с листом", page_has_images: "на странице есть рисунки/формулы картинками",
    spans_pages: "текст переходит на следующую страницу", duplicate_id: "код повторяется в таблице", vpr: "урок отдан под ВПР — стоит не на месте своей темы" };
  const LK = { review: ["повторение / контроль", "rev"], region: ["«Наш край»", "reg"], new: ["новый материал", ""] };
  const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const fmtH = h => (Math.round(h * 100) / 100).toString().replace(".", ",");
  const pages = (a, b) => (b && b !== a ? `с. ${a}–${b}` : `с. ${a}`);
  const label = n => n.t === "rec" ? (n.ty === "lesson" ? `Урок ${n.c}. ${n.x}` : `${n.c} ${n.x}`) : n.l;
  const shortLabel = n => n.t === "rec" ? (n.ty === "lesson" ? `Урок ${n.c}` : n.c) : n.l + (n.s && n.t === "block" ? " · " + n.s : "");

  document.getElementById("docmeta").textContent =
    `${DATA.meta.pages} стр. · вступает в силу ${DATA.meta.in_force || "—"} · ${DATA.meta.status}`;

  // ---------- дерево
  const treeEl = document.getElementById("tree");
  const rowEl = new Map();
  function rowHTML(n) {
    let chips = "", main = esc(n.l), sub = n.s ? esc(n.s) : "";
    if (n.t === "subj" && n.parsed) chips = '<span class="chip ok">размечено</span>';
    if (n.t === "block" && n.src) chips = '<span class="chip cons">Конструктор</span>';
    if (n.t === "table" && n.n != null) sub = (sub ? sub + " · " : "") + `${n.n} зап.` + (n.rev ? ` · повторение ${n.rev}` : "");
    if (n.t === "rec") {
      main = (n.ty === "lesson" ? `<span class="code">Урок ${esc(n.c)}</span>` : `<span class="code">${esc(n.c)}</span>`) + (n.xl ? mathHTML(n.xl, "none") : esc(n.x));
      if (n.lk && n.lk !== "new") chips = `<span class="chip ${LK[n.lk][1]}">${n.lt && LT[n.lt] ? LT[n.lt][0] : LK[n.lk][0]}</span>`;
      else if (n.lt === "lab" || n.lt === "mixed") chips = '<span class="chip lab">лаб.</span>';
      if (n.f && n.f.includes("vpr")) chips += '<span class="chip warn">ВПР</span>';
      if (n.ty === "theme") chips += `<span class="chip">${fmtH(n.h)} ч</span>`;
      if (n.xl) chips += '<span class="chip ok">формулы</span>';
      else if (n.f && n.f.includes("formula_suspect")) chips += '<span class="chip warn">формулы</span>';
      if (n.wh != null && !n.ig) chips += wChip(n, false);
      if (n.xc && !n.ig) chips += `<span class="chip">${n.xc.length} эл.</span>`;
      if (n.re && n.re.length) chips += `<span class="chip">${EXL(n.re[0])} ${n.re.map(x => x.split(".").pop()).join(", ")}</span>`;
      else if (n.re) chips += `<span class="chip warn">нет в ${n.i.startsWith("OOO") ? "ОГЭ" : "ЕГЭ"}</span>`;
      if (n.rc) chips += `<span class="chip ${n.rc.length ? "" : "warn"}">${n.rc.length} ум.</span>`;
    }
    const has = n.t !== "rec" && ((n.c && n.c.length) || (n.r && n.r.length));
    const pg = (n.t === "rec" ? `с. ${n.pg}` : pages(n.pg, n.pe));
    return `<span class="caret">${has ? "▶" : ""}</span><span class="lab"><span class="main-l">${main}</span>${sub ? `<span class="sub">${sub}</span>` : ""}</span><span class="pg">${chips} ${pg}</span>`;
  }
  function makeNode(n) {
    const wrap = document.createElement("div");
    wrap.className = "t-" + n.t;
    const b = document.createElement("button");
    b.className = "row"; b.type = "button"; b.dataset.id = n.i; b.setAttribute("role", "treeitem");
    b.innerHTML = rowHTML(n);
    const has = n.t !== "rec" && ((n.c && n.c.length) || (n.r && n.r.length));
    if (has) b.setAttribute("aria-expanded", "false");
    wrap.appendChild(b);
    rowEl.set(n.i, b);
    return wrap;
  }
  function expand(id, open) {
    const b = rowEl.get(id); if (!b || !b.hasAttribute("aria-expanded")) return;
    const n = nodes.get(id);
    let kids = b.nextElementSibling;
    if (!kids) {
      kids = document.createElement("div"); kids.className = "kids"; kids.setAttribute("role", "group");
      (n.c || []).forEach(ch => kids.appendChild(makeNode(ch)));
      (n.r || []).forEach(r => kids.appendChild(makeNode(r)));
      b.parentNode.appendChild(kids);
    }
    const want = open == null ? b.getAttribute("aria-expanded") !== "true" : open;
    b.setAttribute("aria-expanded", String(want));
    kids.hidden = !want;
  }
  DATA.tree.forEach(n => treeEl.appendChild(makeNode(n)));
  treeEl.addEventListener("click", e => {
    const b = e.target.closest(".row"); if (!b) return;
    const id = b.dataset.id;
    const wasSel = b.classList.contains("sel");
    if (b.hasAttribute("aria-expanded")) expand(id, wasSel ? null : true);
    select(id, { fromTree: true });
  });

  // ---------- карточка
  const card = document.getElementById("card");
  function linkBtn(id, text) { return `<button type="button" data-go="${esc(id)}">${esc(text)}</button>`; }
  function renderCard(n) {
    const chain = ancestors(n.i).map(a => nodes.get(a));
    const crumbs = chain.map(a => `<button type="button" data-go="${esc(a.i)}">${esc(shortLabel(a))}</button>`).join('<span class="sep">/</span>');
    let h = `<div class="crumbs">${crumbs || "Документ"}</div>`;
    const meta = [];
    if (n.t === "rec") {
      const title = n.ty === "lesson" ? `<span class="code">Урок ${esc(n.c)}</span>${esc(n.x)}` : `<span class="code">${esc(n.c)}</span>${n.xl ? mathHTML(n.xl, "none") : esc(n.x)}`;
      h += `<h2>${title}</h2>`;
      meta.push(`<span class="chip">${TYPE_RU[n.ty] || n.ty}</span>`);
      const tbl = nodes.get(parent.get(n.i));
      if (n.g) meta.push(`<span class="chip">${esc(n.g)}</span>`);
      if (n.v) meta.push(`<span class="chip">глагол: ${esc(n.v)}</span>`);
      if (n.lk) meta.push(`<span class="chip ${LK[n.lk][1]}">${LK[n.lk][0]}</span>`);
      if (n.h != null && n.ty === "lesson") meta.push(`<span class="chip">${n.h} ч</span>`);
      if (n.lt && LT[n.lt]) meta.push(`<span class="chip ${LT[n.lt][1]}">${LT[n.lt][0]}</span>`);
      if (n.kr) meta.push(`<span class="chip">контрольных: ${fmtH(n.kr)}</span>`);
      if (n.pr) meta.push(`<span class="chip">практических: ${fmtH(n.pr)}</span>`);
      if (n.ty === "theme") meta.push(`<span class="chip">${fmtH(n.h)} ч</span>`);
      if (n.ig) meta.push(`<span class="chip">группа</span>`);
      (n.f || []).forEach(f => { if (n.xl && (f === "formula_suspect" || f === "page_has_images")) return; meta.push(`<span class="chip warn">${esc(FLAG_RU[f] || f)}</span>`); });
      if (n.xl) meta.push('<span class="chip ok">формулы — по MinerU</span>');
      if (isCons(n)) meta.push('<span class="chip cons">Конструктор edsoo</span>');
      meta.push(`<span class="pg">${isCons(n) ? "Конструктор, " : ""}стр. ${n.pg}${tbl ? " · " + esc(tbl.l) : ""}</span>`);
      h += `<div class="meta">${meta.join("")}</div>`;
      if (n.xl && /!\[\]\(/.test(n.xl)) h += `<div class="mathbox"><div class="mlab">Рисунки из документа · MinerU</div>${(n.xl.match(/!\[\]\(images\/[^)\s]+\)/g) || []).map(m => mathHTML(m)).join(" ")}</div>`;
      if (n.wh != null) {
        h = h.replace('<div class="meta">', `<div class="meta"><span class="chip ${n.wh > 0 ? "" : "warn"}">вес${n.i.includes(".physics.") ? " по Конструктору" : ""}: ${fmtH(n.wh)} ч · ${fmtH(n.ws)}% учебного времени класса</span>${n.wd ? `<span class="chip deep" title="${DEEP_T}">из углублённого плана: ${fmtH(n.wd)} ч</span>` + (n.wh - n.wd > 0.001 ? `<span class="chip">из базового: ${fmtH(+(n.wh - n.wd).toFixed(2))} ч</span>` : "") : (n.wh > 0 && n.i.includes(".physics.") && !n.ig ? '<span class="chip">из базового плана</span>' : "")}`);
      }
      const rel = [];
      if (n.le && n.le.length) {
        const lab = n.lk === "review" ? "Повторяет" : (n.le.length > 1 ? "Элементы содержания" : "Элемент содержания");
        rel.push(`<b>${lab}</b>` + n.le.map(e => nodes.has(e) ? linkBtn(e, (e.includes(".oge.") ? "ОГЭ " : "") + nodes.get(e).c + " " + nodes.get(e).x.slice(0, 60)) : "").join(""));
      }
      if (n.ty === "lesson" && n.m) rel.push(`<b>Сопоставление</b><span class="chip ${n.m === "manual" ? "ok" : ""}">${n.m === "manual" ? "исправлено вручную" : n.m === "review" ? "урок повторения — без веса" : "автоматически"}</span>` + (n.le && n.le.some(e => e.includes(".oge.")) ? '<span class="chip warn">в кодификаторе класса элемента нет — связь через ОГЭ</span>' : "") + (n.le && n.le.length > 1 && n.lk !== "review" ? `<span class="chip">${n.sh ? "доли часа: " + n.sh.map(fmtH).join(" / ") : "час делится на " + n.le.length}</span>` : ""));
      if (n.wl && n.wl.length) rel.push(`<b>Уроки (${n.wl.length})</b>` + n.wl.map(l => linkBtn(l, "Урок " + nodes.get(l).c)).join(""));
      if (n.wdl && n.wdl.length) rel.push(`<b>Из углублённого плана</b>` + n.wdl.map(t => `<span class="chip" style="white-space:normal;text-align:left">${esc(t)}</span>`).join("") + `<span class="pg">в базовом плане уроков нет; час углублённого урока ≈ 0,41 ч базового</span>`);
      if (n.wdn && !n.ig) rel.push(`<b>Почему вес 0</b><span class="pg">${esc(n.wdn)}</span>`);
      if (n.wr && n.wr.length) rel.push(`<b>Повторение</b>` + n.wr.map(l => linkBtn(l, "Урок " + nodes.get(l).c)).join(""));
      if ((n.ty === "lesson" && n.lk !== "review") || n.xe !== undefined) {
        const exs = examOf(n);
        rel.push(`<b>На экзамене</b>` + (exs.length
          ? exs.map(o => linkBtn(o.id, `${EXL(o.id)} ${nodes.get(o.id).c}${o.via ? " (через другой уровень)" : ""} — ${short(nodes.get(o.id).x, 60)}`)).join("")
          : `<span class="chip ${n.xm === "region" ? "" : "warn"}">${n.xm === "region" ? "региональный компонент — на экзамене не проверяется" : "отдельного пункта в кодификаторе экзамена нет"}</span>`)
          + (n.xm === "manual" ? '<span class="chip ok">сопоставлено вручную</span>' : n.xm === "auto" ? '<span class="chip">сопоставлено автоматически</span>' : ""));
      }
      if (n.re !== undefined) {
        rel.push(`<b>На экзамене (умение)</b>` + (n.re.length
          ? n.re.map(id => nodes.has(id) ? linkBtn(id, `${EXL(id)} ${nodes.get(id).c} — ${short(nodes.get(id).x, 70)}`) : "").join("")
          : `<span class="chip warn">${esc(n.rn || "аналога нет")}</span>`)
          + (n.rm === "manual" ? '<span class="chip ok">сопоставлено вручную</span>' : n.re.length ? '<span class="chip">по правилу</span>' : ""));
      }
      if (n.rc !== undefined) {

  function goTo(page, snips, n) {

  // нормализованный текст страницы: только буквы и цифры, с картой обратно в элементы
  const KEEP = /[\p{L}\p{N}]/u;
  function buildIndex(tc) {
    let s = ""; const map = [];

  // запасной поиск для ячеек таблиц: слова фрагмента по порядку, между ними допускается «шум»

  function fuzzyRanges(idx, snippet) {

      from = p0 + 1;

  }

  async function renderPage(num, snips) {
    if (!pdfDoc) return;

    const page = await pdfDoc.getPage(num);
    if (my !== token) return;
    const base = page.getViewport({ scale: 1 });

  const DEEP_T = "часы взяты из углублённого плана Конструктора: в базовом плане уроков на этот элемент нет (1 ч углублённого ≈ 0,41–0,67 ч базового)";

    return parts.map((p, i) => {
      if (i % 2) {
        if (window.katex) { try { return katex.renderToString(p, { throwOnError: false, strict: "ignore" }); } catch (_) {} }
        return `<code>${esc(p)}</code>`;
      }
      return esc(p).replace(/!\[\]\((images\/[^)\s]+)\)/g, (_, f) => img === "none" ? "" : `<img class="${img === "thumb" ? "thumb" : ""}" src="../1_разметка/mineru/result/${f}" alt="рисунок" title="рисунок из документа (MinerU)">`);
    }).join("");
  }
  function elBtn(id, n) {
    const e = nodes.get(id); if (!e) return "";
    return `<div class="el"><button type="button" class="lnk" data-go="${esc(id)}"><span class="code">${id.includes(".oge.") ? "ОГЭ " : ""}${esc(e.c)}</span>${esc(short(e.x, n || 150))}</button>${e.wh != null && !e.ig ? ` <span class="chip" title="Вес элемента = сумма часов всех уроков, отнесённых к нему">всего у элемента: ${fmtH(e.wh)} ч${e.wl && e.wl.length ? ` (уроки ${e.wl.map(x => nodes.get(x).c).join(", ")})` : ""}</span>` : ""}</div>`;
  }
  function seg(name, items, cur) {
    return `<div class="seg" role="group">` + items.map(([v, l]) => `<button type="button" data-${name}="${v}" aria-pressed="${v === cur}">${l}</button>`).join("") + `</div>`;
  }
  function renderLinks() {
    const S = SUBJ[lk.subj];
    if (!S.classes.some(([p, k]) => p === lk.part && k === lk.g)) { lk.part = S.classes[0][0]; lk.g = S.classes[0][1]; }
    if (!S.views.some(([v]) => v === lk.view)) { lk.view = S.views[0][0]; lk.filter = "all"; }
    const { part, g, subj } = lk;
    const exk = part === "OOO" ? "oge" : "ege", exName = part === "OOO" ? "ОГЭ" : "ЕГЭ";
    const les = (nodes.get(`${part}.${subj}.les.g${g}`) || {}).r || [];
    const els = (nodes.get(`${part}.${subj}.cls.g${g}.el`) || {}).r || [];
    const req = (nodes.get(`${part}.${subj}.cls.g${g}.req`) || {}).r || [];
    const exEls = (nodes.get(`${part}.${subj}.${exk}.el`) || {}).r || [];
    const hist = les.length > 0;  // есть поурочный план (история — приказ, физика — Конструктор)
    const cons = subj === "physics";
    const filters = {
      lessons: [["all", "все"], ["manual", "исправлены вручную"], ["multi", "на несколько элементов"], ["review", "повторение"]].concat(cons ? [["lab", "лабораторные"], ["vpr", "ВПР"]] : []),
      elements: [["all", "все"], ["noexam", `нет в ${exName}`]].concat(hist ? [["zero", "без уроков"]] : []).concat(subj === "physics" ? [["deep", "из углублённого"]] : []),
      exam: [["all", "элементы содержания"], ["req", "требования (умения)"]],
    };
    if (!filters[lk.view].some(([f]) => f === lk.filter)) lk.filter = "all";
    let h = `<div class="lk-head">` + seg("subj", [["history", "История"], ["physics", "Физика"]], subj) +
      seg("cls", S.classes.map(([p, k]) => [`${p}.${k}`, `${p === "OOO" ? "ООО" : "СОО"} ${k}`]), `${part}.${g}`) +
      seg("view", S.views, lk.view) + (filters[lk.view].length > 1 ? seg("filter", filters[lk.view], lk.filter) : "") + `</div>`;
    const leaves = els.filter(e => !e.ig);
    const hasEx = e => (e.xe && e.xe.length) || (e.xd && e.xd.length);
    if (lk.view === "exam" && lk.filter === "req") {
      const exReq = (nodes.get(`${part}.${subj}.${exk}.req`) || {}).r || [];
      const lvl = S.classes.filter(([p]) => p === part).map(([, k]) => k);
      const clsReq = lvl.flatMap(k => ((nodes.get(`${part}.${subj}.cls.g${k}.req`) || {}).r || []).filter(r => !r.ig));
      const noEx = clsReq.filter(r => r.re && !r.re.length);
      h += `<div class="lk-sum">${S.name}, требования ${exName} (умения) — весь уровень (${lvl[0]}–${lvl[lvl.length - 1]} классы): <b>${exReq.filter(x => !x.ig).length}</b>. Для каждого — умения классов, из которых оно складывается. Без опоры на умения классов: <b>${exReq.filter(x => !x.ig && !(x.rc || []).length).length}</b>; умений классов без аналога в ${exName}: <b>${noEx.length}</b> из ${clsReq.length}.</div>`;
    } else if (lk.view === "exam") {
      h += `<div class="lk-sum">${S.name}, кодификатор ${exName} — весь уровень (${part === "OOO" ? (subj === "history" ? "5–9" : "7–9") : "10–11"} классы), пунктов: <b>${exEls.filter(e => !e.ig).length}</b>. Для каждого пункта — элементы классов, на которые он опирается${subj === "history" ? ", и часы уроков за ними" : ", и часы уроков за ними по Конструктору"}. «*» — связь через другой уровень (ЕГЭ опирается на материал ${hist ? "5–9" : "7–9"} классов).</div>`;
    } else {
      h += `<div class="lk-sum">${S.name}, ${g} класс: ` + (hist
        ? `<b>${les.length}</b> уроков${cons ? ' <span class="chip cons">по Конструктору edsoo — в приказе поурочного плана нет</span>' : ""} (с новым материалом <b>${les.filter(l => l.lk !== "review").length}</b>, исправлено вручную <b>${les.filter(l => l.lk !== "review" && l.m === "manual").length}</b>); `
        : `поурочного плана в приказе нет; `) +
        `элементов содержания <b>${leaves.length}</b>, без пункта в ${exName}: <b>${leaves.filter(e => !hasEx(e)).length}</b>` + (hist ? `, без уроков: <b>${leaves.filter(e => e.wh === 0).length}</b>` : "") + `.` + (subj === "physics" ? ` Часы — по базовому плану Конструктора; <span class="chip deep">углубл.</span> — у элемента нет уроков в базовом плане, часы взяты из углублённого: <b>${leaves.filter(e => e.wd).length}</b>.` : "") + `</div>`;
      const groups = []; let cur = null;
      req.forEach(r => { if (r.ig || !r.c.includes(".")) { cur = { g: r, items: [] }; groups.push(cur); } else if (cur) cur.items.push(r); else { cur = { g: null, items: [r] }; groups.push(cur); } });
      h += `<details class="skills"><summary><b>Проверяемые умения ${g} класса</b> (${req.filter(r => !r.ig).length}${req.some(r => r.re && !r.re.length) ? `, без аналога в ${exName}: ${req.filter(r => r.re && !r.re.length).length}` : ""}) <small>— в документе они не привязаны к урокам и элементам: проверяются на материале любого элемента класса</small></summary>` +
        groups.map(gr => (gr.g ? `<div class="grp">${esc(gr.g.c)}. ${esc(short(gr.g.x, 140))}</div>` : "") +
          `<ul>${gr.items.map(r => `<li><button type="button" data-go="${esc(r.i)}"><span class="code">${esc(r.c)}</span><span class="vb">${esc(r.v || "")}</span> — ${esc(short(r.x, 170))}</button>${r.re ? (r.re.length ? exChips(r.re.map(id => ({ id }))) : `<span class="nox" title="${esc(r.rn || "")}">нет в ${exName}</span>`) : ""}</li>`).join("")}</ul>`).join("") + `</details>`;
    }
    if (lk.view === "lessons") {
      const pass = l => lk.filter === "all" || (lk.filter === "manual" && l.m === "manual") || (lk.filter === "multi" && l.lk !== "review" && l.le && l.le.length > 1) || (lk.filter === "review" && l.lk === "review") || (lk.filter === "lab" && (l.lt === "lab" || l.lt === "mixed")) || (lk.filter === "vpr" && l.f && l.f.includes("vpr"));
      const rows = les.filter(pass);
      h += `<div class="lgrid"><div class="lrow l5 head"><span>№</span><span>Урок</span><span>Проверяемый элемент содержания</span><span>${exName}</span><span>Сопоставление</span></div>`;
      let lastSec = null;
      rows.forEach(l => {
        const fe = (l.le || [])[0] && nodes.get(l.le[0]);
        const sec = l.lk === "review" ? null : (fe ? (fe.p || fe.i) : null);
        if (sec && sec !== lastSec) { const s = nodes.get(sec); if (s) h += `<div class="lsec"><span class="code">${sec.includes(".oge.") ? "ОГЭ " : ""}${esc(s.c)}</span>${esc(short(s.x, 120))}${s.wh != null ? ` <span class="chip">${fmtH(s.wh)} ч · ${fmtH(s.ws)}%</span>` : ""}</div>`; lastSec = sec; }
        const mchip = (l.lk === "review" ? `<span class="chip rev">${l.lt && LT[l.lt] ? LT[l.lt][0] : "повторение"}, без веса</span>` : l.m === "manual" ? '<span class="chip ok">вручную</span>' : '<span class="chip">авто</span>')
          + (l.lk !== "review" && (l.lt === "lab" || l.lt === "mixed") ? `<span class="chip lab">${l.lt === "lab" ? "лаб." : "теория + лаб."}</span>` : "") + (l.f && l.f.includes("vpr") ? '<span class="chip warn">ВПР</span>' : "");
        const extra = (l.le || []).some(e => e.includes(".oge.")) ? ' <span class="chip warn">нет в кодификаторе класса</span>' : (l.le && l.le.length > 1 && l.lk !== "review" ? ` <span class="chip">${l.sh ? "час: " + l.sh.map(fmtH).join(" / ") : "час ÷ " + l.le.length}</span>` : "");
        const target = (l.le && l.le.length) ? (l.lk === "review" ? `<span class="pg">повторяет:</span>` : "") + l.le.map(e => elBtn(e, 150)).join("") : `<span class="pg">${l.lk === "review" ? "обобщение по всему курсу" : "—"}</span>`;
        h += `<div class="lrow l5 ${l.lk === "review" ? "rev" : ""}"><span class="num">${esc(l.c)}</span><button type="button" class="lnk" data-go="${esc(l.i)}">${esc(l.x)}</button><div>${target}</div><div>${l.lk === "review" ? "" : exChips(examOf(l))}</div><div>${mchip}${extra}</div></div>`;
      });
      if (!rows.length) h += `<div class="lk-empty">Таких уроков в этом классе нет.</div>`;
      h += `</div>`;
    } else if (lk.view === "elements") {
      const leafPass = e => lk.filter === "all" || (lk.filter === "zero" && e.wh === 0) || (lk.filter === "noexam" && !hasEx(e)) || (lk.filter === "deep" && e.wd);
      h += `<div class="lgrid"><div class="lrow e5 head"><span>Код</span><span>Элемент содержания</span><span>${exName}</span><span>${hist ? "Вес" : ""}</span><span>${hist ? "Уроки" : ""}</span></div>`;
      let shown = 0;
      els.forEach(e => {
        if (e.ig) {
          if (lk.filter !== "all" && !els.some(x => x.p === e.i && leafPass(x))) return;
          h += `<div class="lsec"><span class="code">${esc(e.c)}</span>${esc(short(e.x, 120))}${e.wh != null ? ` <span class="chip">${fmtH(e.wh)} ч · ${fmtH(e.ws)}%</span>` : ""}${e.wr && e.wr.length ? ` <span class="chip rev">повторение: ${e.wr.map(x => (gradeOf(x) !== g ? gradeOf(x) + " кл. " : "") + nodes.get(x).c).join(", ")}</span>` : ""}</div>`;
          return;
        }
        if (!leafPass(e)) return;
        shown++;
        const ex = examOf(e);
        const exCell = ex.length ? exChips(ex) + (e.xm === "manual" ? '<span class="chip ok">вручную</span>' : "") : `<span class="pg">${e.xm === "region" ? "региональный" : "нет пункта"}</span>`;
        h += `<div class="lrow e5 ${hist && e.wh === 0 ? "zero" : ""}"><span class="code">${esc(e.c)}</span><button type="button" class="lnk" data-go="${esc(e.i)}">${e.xl ? mathHTML(e.xl, "thumb") : esc(short(e.x, 220))}</button><div>${exCell}</div><span>${e.wh != null ? `${wChip(e, true, true)}` : ""}</span><div class="lchips">${hist ? ((e.wl || []).map(x => { const L = nodes.get(x); return `<button type="button" data-go="${esc(x)}" title="${esc(L.x)}">${esc(L.c)}</button>`; }).join("") || (e.wdl ? e.wdl.map(t => `<span class="chip deep" title="${esc(t)}">углубл. ${esc((/урок (\d+)/.exec(t) || [])[1] || "")}</span>`).join("") : '<span class="pg">нет уроков</span>')) : ""}</div></div>`;
      });
      if (!shown) h += `<div class="lk-empty">Таких элементов в этом классе нет.</div>`;
      h += `</div>`;
    } else if (lk.filter === "req") {
      const exReq = (nodes.get(`${part}.${subj}.${exk}.req`) || {}).r || [];
      h += `<div class="lgrid"><div class="lrow xr head"><span>Код</span><span>Требование ${exName}</span><span>Умения классов</span><span>Всего</span></div>`;
      exReq.forEach(x => {
        if (x.ig) { h += `<div class="lsec"><span class="code">${exName} ${esc(x.c)}</span>${esc(short(x.x, 120))}</div>`; return; }
        const cs = x.rc || [], byG = new Map();
        cs.forEach(c => { const k = gradeOf(c); if (!byG.has(k)) byG.set(k, []); byG.get(k).push(c); });
        const cell = [...byG].sort((a, b) => a[0] - b[0]).map(([k, list]) => `<div class="byg"><span class="gl">${k} кл.</span>${list.map(c => { const C = nodes.get(c); return C ? `<span class="lchips"><button type="button" data-go="${esc(c)}" title="${esc(C.x)}">${esc(C.c)}</button></span>` : ""; }).join("")}</div>`).join("");
        h += `<div class="lrow xr ${cs.length ? "" : "zero"}"><span class="code">${esc(x.c)}</span><button type="button" class="lnk" data-go="${esc(x.i)}">${esc(short(x.x, 260))}</button><div>${cell || '<span class="pg">в требованиях классов такого умения нет</span>'}</div><span><span class="chip ${cs.length ? "" : "warn"}">${cs.length}</span></span></div>`;
      });
      const lvl = S.classes.filter(([p]) => p === part).map(([, k]) => k);
      const noEx = lvl.flatMap(k => ((nodes.get(`${part}.${subj}.cls.g${k}.req`) || {}).r || []).filter(r => !r.ig && r.re && !r.re.length));
      if (noEx.length) {
        h += `<div class="lsec">Умения классов без аналога в ${exName} (${noEx.length})</div>`;
        noEx.forEach(r => { h += `<div class="lrow xr"><span class="code">${gradeOf(r.i)} кл.</span><button type="button" class="lnk" data-go="${esc(r.i)}"><span class="code">${esc(r.c)}</span>${esc(short(r.x, 220))}</button><div><span class="pg">${esc(r.rn || "")}</span></div><span></span></div>`; });
      }
      h += `</div>`;
    } else {
      const withH = exEls.some(x => x.xh != null);
      h += `<div class="lgrid"><div class="lrow x head"><span>Код</span><span>Пункт ${exName}</span><span>Элементы классов</span><span>${withH ? "Часы" : "Эл."}</span></div>`;
      exEls.forEach(x => {
        if (x.ig) { h += `<div class="lsec"><span class="code">${exName} ${esc(x.c)}</span>${esc(short(x.x, 120))}${x.xh != null ? ` <span class="chip">${fmtH(x.xh)} ч</span>` : ""}</div>`; return; }
        const cs = x.xc || [];
        let cell = cs.slice(0, 40).map(c => { const C = nodes.get(c); if (!C) return ""; const via = !(C.xe || []).includes(x.i); return `<button type="button" data-go="${esc(c)}" title="${esc(C.x)}">${gradeOf(c)} кл. ${esc(C.c)}${via ? "*" : ""}</button>`; }).join("") + (cs.length > 40 ? `<span class="pg">ещё ${cs.length - 40}</span>` : "");
        if (!cell && x.wl && x.wl.length) cell = x.wl.map(l => `<button type="button" data-go="${esc(l)}" title="${esc(nodes.get(l).x)}">урок ${esc(nodes.get(l).c)}</button>`).join("");
        h += `<div class="lrow x"><span class="code">${esc(x.c)}</span><button type="button" class="lnk" data-go="${esc(x.i)}">${x.xl ? mathHTML(x.xl, "thumb") : esc(short(x.x, 200))}</button><div class="lchips">${cell || '<span class="pg">нет</span>'}</div><span>${x.xh != null ? `<span class="chip">${fmtH(x.xh)} ч</span>` : `<span class="chip">${cs.length}</span>`}</span></div>`;
      });
      h += `</div>`;
    }
    linksEl.innerHTML = h;
  }
  linksEl.addEventListener("click", e => {
    const t = e.target.closest("[data-go],[data-cls],[data-view],[data-filter],[data-subj]"); if (!t) return;
    if (t.dataset.subj) { lk.subj = t.dataset.subj; }
    if (t.dataset.go) { setMode("doc", true); select(t.dataset.go, {}); return; }
    if (t.dataset.cls) { const [p, k] = t.dataset.cls.split("."); lk.part = p; lk.g = +k; }
    if (t.dataset.view) { lk.view = t.dataset.view; lk.filter = "all"; }
    if (t.dataset.filter) lk.filter = t.dataset.filter;
    linksEl.scrollTop = 0;
    setMode("links");
  });
  function openFromHash(given) {
    const id = typeof given === "string" ? given : decodeURIComponent((location.hash || "").slice(1));
    const m = /^links\.(?:(history|physics)\.)?(OOO|SOO)\.g(\d+)$/.exec(id);
    if (m) { if (m[1]) lk.subj = m[1]; lk.part = m[2]; lk.g = +m[3]; if (mode !== "links") setMode("links"); else renderLinks(); return true; }
    if (id && id !== selected && nodes.has(id)) { if (mode !== "doc") setMode("doc", true); select(id, {}); return true; }
    return false;
  }
  window.addEventListener("hashchange", () => openFromHash());

  // ---------- старт
  const start = decodeURIComponent((location.hash || "").slice(1));
  select(nodes.has(start) ? start : DEFAULT_ID, {});
  if (/^links\./.test(start)) openFromHash(start);
  // PDF открывается из select() → goTo(): нужный документ (приказ или выгрузка Конструктора) выбирается по пункту
})();
</script>


</body>
