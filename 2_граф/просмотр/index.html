2","code":"1.2","g":5,"x":"Происхождение, расселение и эволюция древнейшего человека. Условия жизни и занятия первобытных людей. Овладение огнём. Появление человека разумного. Охота и собирательство. Присваивающее хозяйство. Род и родовые отношения. Древнейшие земледельцы и скотоводы: трудовая деятельность, изобретения. Появление ремёсел. Производящее хозяйство. Развитие обмена и торговли. Переход от родовой к соседской общине. Появление знати. Представления об окружающем мире, верования первобытных людей. Искусство первобытных людей. Разложение первобытнообщинных отношений. На пороге цивилизации","sec":"5 кл. · 1 Введение в историю. Первобытность","c":["C.history.proishozhdenie-cheloveka","C.history.rasselenie-drevneyshego-cheloveka","C.history.evolyutsiya-drevneyshego-cheloveka","C.history.zanyatiya-pervobytnyh-lyudey","C.history.ovladenie-ognem","C.history.chelovek-razumnyy","C.history.ohota","C.history.sobiratelstvo","C.history.prisvaivayuschee-hozyaystvo","C.history.rod","C.history.zemledelie","C.history.skotovodstvo","C.history.remeslo","C.history.proizvodyaschee-hozyaystvo","C.history.obmen","C.history.torgovlya","C.history.rodovaya-obschina","C.history.sosedskaya-obschina","C.history.znat","C.history.verovaniya-pervobytnyh-lyudey","C.history.iskusstvo-pervobytnyh-lyudey","C.history.razlozhenie-pervobytnoobschinnyh-otnosheniy","C.history.tsivilizatsiya"]},{"id":"OOO.history.cls.g5.el.1.3","code":"1.3","g":5,"x":"Понятие и хронологические рамки истории Древнего мира. Карта Древнего мира","sec":"5 кл. · 1 Введение в историю. Первобытность","c":["C.history.drevniy-mir","C.history.karta-drevnego-mira"]},{"id":"OOO.history.cls.g5.el.2.1","code":"2.1","g":5,"x":"Понятие «Древний Восток». Карта древневосточного мира","sec":"5 кл. · 2 Древний Восток","c":["C.history.drevniy-vostok","C.history.karta-drevnevostochnogo-mira"]},{"id":"OOO.history.cls.g5.el.2.2","code":"2.2","g":5,"x":"Древний Египет. Природа Египта. Условия жизни и занятия древних египтян. Возникновение исьменность. Мифы и сказания","sec":"5 кл. · 2 Древний Восток","c":["C.history.drevnyaya-mesopotamiya","C.history.prirodnye-usloviya-mesopotamii","C.history.zanyatiya-naseleniya-mesopotamii","C.history.gorod-gosudarstvo","C.history.sozdanie-edinogo-gosudarstva-v-mesopotamii","C.history.pismennost","C.history.mify-i-skazaniya-mesopotamii"]},{"id":"OOO.history.cls.g5.el.2.4","code":"2.4","g":5,"x":"Древний Вавилон. Царь Хаммурапи и его законы","sec":"5 кл. · 2 Древний Восток","c":["C.history.drevniy-vavilon","C.history.hammurapi","C.history.zakony-hammurapi"]},{"id":"OOO.history.cls.g5.el.2.5","code":"2.5","g":5,"x":"Ассирия. Завоевания ассирийцев. Создание сильной державы. Культурные сокровища Ниневии. Гибель империи","sec":"5 кл. · 2 Древний Восток","c":["C.history.assiriya","C.history.zavoevaniya-assiriytsev","C.history.sozdanie-assiriyskoy-derzhavy","C.history.nineviya","C.history.kulturnye-sokrovischa-ninevii","C.history.gibel-assiriyskoy-imperii"]},{"id":"OOO.history.cls.g5.el.2.6","code":"2.6","g":5,"x":"Усиление Нововавилонского царства. Легендарные памятники города Вавилона","sec":"5 кл. · 2 Древний Восток","c":["C.history.novovavilonskoe-tsarstvo","C.history.vavilon","C.history.legendarnye-pamyatniki-vavilona"]},{"id":"OOO.history.cls.g5.el.2.7","code":"2.7","g":5,"x":"Восточное Средиземноморье в древности. Природные условия, их влияние на занятия жителей. Финикия: развитие ремёсел, караванной и морской торговли. Города- государства. Финикийская колонизация. Финикийский алфавит","sec":"5 кл. · 2 Древний Восток","c":["C.history.vostochnoe-sredizemnomore","C.history.prirodnye-usloviya-vostochnogo-sredizemnomorya","C.history.finikiya","C.history.remeslo","C.history.karavannaya-torgovlya","C.history.morskaya-torgovlya","C.history.gorod-gosudarstvo","C.history.finikiyskaya-kolonizatsiya","C.history.finikiyskiy-alfavit"]},{"id":"OOO.history.cls.g5.el.2.8","code":"2.8","g":5,"x":"Палестина и её население. Возникновение Израильского государства. Царь Соломон. Религиозные верования. Ветхозаветные предания","sec":"5 кл. · 2 Древний Восток","c":["C.history.palestina","C.history.naselenie-palestiny","C.history.izrailskoe-gosudarstvo","C.history.solomon","C.history.religiya-drevney-palestiny","C.history.vethozavetnye-predaniya"]},{"id":"OOO.history.cls.g5.el.2.9","code":"2.9","g":5,"x":"Персидская держава. Завоевания персов. Государство Ахеменидов. Великие цари: Кир II Великий, Дарий I. Расширение территории державы. Государственное устройство. Центр и сатрапии, управление империей. Религия персов","sec":"5 кл. · 2 Древний Восток","c":["C.history.persidskaya-derzhava","C.history.zavoevaniya-persov","C.history.kir-ii-velikiy","C.history.dariy-i","C.history.rasshirenie-territorii-persidskoy-derzhavy","C.history.gosudarstvennoe-ustroystvo-persidskoy-derzhavy","C.history.satrapiya","C.history.religiya-persov"]},{"id":"OOO.history.cls.g5.el.2.10","code":"2.10","g":5,"x":"Древняя Индия. Природные условия Древней Индии. Занятия населения. Древнейшие города-государства. Приход ариев в Северную Индию. Держава Маурьев. Государство Гуптов. Общественное устройство, варны. Религиозные верования древних индийцев. Легенды и сказания. Возникновение и распространение буддизма. Культурное наследие Древней Индии (эпос и литература, художественная культура, научное познание)","sec":"5 кл. · 2 Древний Восток","c":["C.history.drevnyaya-indiya","C.history.prirodnye-usloviya-drevney-indii","C.history.zanyatiya-naseleniya-drevney-indii","C.history.gorod-gosudarstvo","C.history.arii","C.history.prihod-ariev-v-severnuyu-indiyu","C.history.derzhava-maurev","C.history.gosudarstvo-guptov","C.history.obschestvennoe-ustroystvo-drevney-indii","C.history.varna","C.history.religiya-drevney-indii","C.history.legendy-i-skazaniya-drevney-indii","C.history.buddizm","C.history.kulturnoe-nasledie-drevney-indii","C.history.epos-drevney-indii","C.history.literatura-drevney-indii","C.history.hudozhestvennaya-kultura-drevney-indii","C.history.nauchnoe-poznanie-v-drevney-indii"]},{"id":"OOO.history.cls.g5.el.2.11","code":"2.11","g":5,"x":"Древний Китай. Природные условия Древнего Китая. Хозяйственная деятельность и условия жизни населения. Древнейшие царства. Создание объединённой империи. Цинь Шихуанди. Возведение Великой Китайской стены. Правление династии Хань. Жизнь в империи: правители и подданные, положение различных групп населения. Развитие ремёсел и торговли. Великий шёлковый путь. Религиозно- философские учения. Конфуций. Научные знания и изобретения древних китайцев. Храмы","sec":"5 кл. · 2 Древний Восток","c":["C.history.drevniy-kitay","C.history.prirodnye-usloviya-drevnego-kitaya","C.history.hozyaystvennaya-deyatelnost-v-drevnem-kitae","C.history.drevneyshie-tsarstva-kitaya","C.history.sozdanie-obedinennoy-imperii-v-kitae","C.history.tsin-shihuandi","C.history.velikaya-kitayskaya-stena","C.history.dinastiya-han","C.history.zhizn-v-imperii-drevnego-kitaya","C.history.remeslo","C.history.torgovlya","C.history.velikiy-shelkovyy-put","C.history.religiozno-filosofskie-ucheniya-drevnego-kitaya","C.history.konfutsiy","C.history.nauchnye-znaniya-drevnih-kitaytsev","C.history.izobreteniya-drevnih-kitaytsev","C.history.hramy-drevnego-kitaya"]},{"id":"OOO.history.cls.g5.el.3.1","code":"3.1","g":5,"x":"Древнейшая Греция. Природные условия Древней Греции. Занятия населения. Древнейшие государства на Крите. Расцвет и гибель Минойской цивилизации. Государства Ахейской Греции (Микены, Тиринф). Троянская война. Вторжение дорийских племён. Поэмы Гомера «Илиада», «Одиссея»","sec":"5 кл. · 3 Древняя Греция. Эллинизм","c":["C.history.drevneyshaya-gretsiya","C.history.prirodnye-usloviya-drevney-gretsii","C.history.zanyatiya-naseleniya-drevney-gretsii","C.history.krit","C.history.minoyskaya-tsivilizatsiya","C.history.gibel-minoyskoy-tsivilizatsii","C.history.aheyskaya-gretsiya","C.history.mikeny","C.history.tirinf","C.history.troyanskaya-voyna","C.history.doriytsy","C.history.vtorzhenie-doriyskih-plemen","C.history.gomer","C.history.iliada","C.history.odisseya"]},{"id":"OOO.history.cls.g5.el.3.2","code":"3.2","g":5,"x":"Греческие полисы. Подъём хозяйственной жизни после «тёмных веков». Развитие земледелия и ремесла. Становление полисов, их политическое устройство. Аристократия и демос. Великая греческая колонизация. Метрополии и колонии. Афины: утверждение демократии. Законы Солона. Реформы Клисфена, их значение. Спарта: основные группы населения, политическое устройство. Организация военного дела. Спартанское воспитание","sec":"5 кл. · 3 Древняя Греция. Эллинизм","c":["C.history.polis","C.history.podem-hozyaystvennoy-zhizni-v-gretsii","C.history.temnye-veka","C.history.zemledelie","C.history.remeslo","C.history.stanovlenie-polisov","C.history.politicheskoe-ustroystvo-polisov","C.history.aristokratiya","C.history.demos","C.history.velikaya-grecheskaya-kolonizatsiya","C.history.metropoliya","C.history.koloniya","C.history.afiny","C.history.demokratiya","C.history.solon","C.history.zakony-solona","C.history.klisfen","C.history.reformy-klisfena","C.history.sparta","C.history.gruppy-naseleniya-sparty","C.history.politicheskoe-ustroystvo-sparty","C.history.voennoe-delo-v-sparte","C.history.spartanskoe-vospitanie"]},{"id":"OOO.history.cls.g5.el.3.3","code":"3.3","g":5,"x":"Греко-персидские войны. Причины войн. Походы персов на Грецию. Битва при Марафоне, её значение. Усиление афинского могущества; Фемистокл. Битва при Фермопилах. Захват персами Аттики. Победы греков в Саламинском сражении, при Платеях и Микале. Итоги греко-персидских войн","sec":"5 кл. · 3 Древняя Греция. Эллинизм","c":["C.history.greko-persidskie-voyny","C.history.pohody-persov-na-gretsiyu","C.history.bitva-pri-marafone","C.history.femistokl","C.history.bitva-pri-fermopilah","C.history.zahvat-persami-attiki","C.history.attika","C.history.salaminskoe-srazhenie","C.history.bitva-pri-plateyah","C.history.bitva-pri-mikale"]},{"id":"OOO.history.cls.g5.el.3.4","code":"3.4","g":5,"x":"Возвышение Афинского государства. Афины при Перикле. Хозяйственная жи <script>
(function () {

  // Тип понятия кодируется формой узла — одна и та же фигура в графе, списке, легенде и карточке.

  const TYPE_SHAPE = {

    "документ": "square", "термин": "ring", "памятник_культуры": "tri", "религия_верование": "star", "период": "bar",
    // физика
    "явление": "circle", "природное_явление": "tridown", "величина": "square", "закон": "star", "модель": "diamond",
    "опыт": "tri", "прибор": "plus", "понятие": "ring"
  };
  const shapeOf = t => SHAPES[TYPE_SHAPE[t]] ? TYPE_SHAPE[t] : "circle";
  function icon(t) {
    const s = SHAPES[shapeOf(t)];
    const body = s.pts ? `<polygon points="${s.pts.join(" ")}"/>` : `<circle r="${s.hollow ? 0.8 : 0.95}"/>`;
    return `<svg class="ico${s.hollow ? " hollow" : ""}" viewBox="-1.15 -1.15 2.3 2.3" aria-hidden="true">${body}</svg>`;
  }
  const TYPE_RU = { "государство_народ": "государство / народ", "памятник_культуры": "памятник культуры", "религия_верование": "религия", "природное_явление": "явление в природе" };
  const REL = {
    prerequisites_for: { ru: "нужно знать до", out: "нужно для", inn: "опирается на", color: "#1e6fc4", style: "solid" },
    is_a: { ru: "является видом", out: "вид понятия", inn: "виды", color: "#7a7f87", style: "dashed" },
    part_of: { ru: "часть", out: "входит в", inn: "состоит из", color: "#5d8f3a", style: "dotted" },
    participant_of: { ru: "участник", out: "участвовал в", inn: "участники", color: "#2f7d8c", style: "solid" },
    verifies: { ru: "опыт подтверждает", out: "подтверждает", inn: "подтверждается опытами", color: "#8c5aa8", style: "solid" }
  };
  const MODES = [["near", "окрестность"], ["pre", "что нужно знать до"], ["post", "что на это опирается"], ["el", "весь элемент"]];

  // ---------- тема

    renderList();
    const first = set.start && set.concepts[set.start] ? set.start : Object.keys(set.concepts)[0];

    try { history.replaceState(null, "", "#" + key + "/" + first); } catch (_) {}
  }
  document.getElementById("reltoggles").addEventListener("change", e => {
    const t = e.target.dataset.rel; if (!t) return;
    if (e.target.checked) relOn.add(t); else relOn.delete(t);
    drawGraph();
  });

  // ---------- список
  const listEl = document.getElementById("list"), qEl = document.getElementById("q");
  function renderList() {
    const q = qEl.value.trim().toLowerCase().replace(/ё/g, "е");
    const hit = c => !q || (c.n + " " + (c.a || []).join(" ")).toLowerCase().replace(/ё/g, "е").includes(q);
    let h = "", lastSec = null;
    set.elements.forEach(e => {
      const cs = e.c.filter(id => set.concepts[id]);
      if (q && !cs.some(id => hit(set.concepts[id]))) return;
      if (e.sec && e.sec !== lastSec) { h += `<div class="sec">${esc(e.sec)}</div>`; lastSec = e.sec; }
      h += `<div class="grp"><button type="button" class="grp-h" data-el="${esc(e.id)}"><span class="code">${e.g} кл. ${esc(e.code)}</span><span class="t">${esc(e.x.length > 110 ? e.x.slice(0, 110) + "…" : e.x)}</span></button><div class="chips">` +
        cs.map(id => { const c = set.concepts[id]; return `<button type="button" class="cc ${hit(c) ? "" : "dim"}" data-c="${esc(id)}" ${focus && focus.id === id ? 'aria-current="true"' : ""} title="${esc(TYPE_RU[c.t] || c.t)}">${icon(c.t)}<span>${esc(c.n)}</span></button>`; }).join("") + `</div></div>`;
    });
    listEl.innerHTML = h || '<p class="empty" style="padding:12px">Ничего не найдено.</p>';
  }
  qEl.addEventListener("input", renderList);
  listEl.addEventListener("click", e => {
    const c = e.target.closest("[data-c]"); if (c) { setFocus({ kind: "c", id: c.dataset.c }); return; }
    const g = e.target.closest("[data-el]"); if (g) { mode = "el"; setFocus({ kind: "e", id: g.dataset.el }); }

  // ---------- граф
  function cyStyle() {

    return [
      { selector: "node", style: { "background-color": node, shape: "ellipse", label: "data(label)", color: ink, "font-size": 11, "font-family": "PT Sans, Arial, sans-serif",
        "text-wrap": "wrap", "text-max-width": 120, "text-valign": "bottom", "text-margin-y": 4, width: 22, height: 22,
        "text-background-color": bg, "text-background-opacity": 0.85, "text-background-padding": 1 } },
      ...Object.entries(SHAPES).map(([k, sh]) => ({ selector: "node.sh-" + k, style: sh.pts ? { shape: "polygon", "shape-polygon-points": sh.pts.join(" ") }
        : sh.hollow ? { "background-opacity": 0, "border-width": 3, "border-color": node, width: 19, height: 19 } : {} })),
      { selector: "node.focus", style: { width: 32, height: 32, "background-color": acc, "font-weight": 700, "font-size": 12.5,
        "underlay-color": acc, "underlay-opacity": 0.16, "underlay-padding": 7, "underlay-shape": "ellipse" } },
      { selector: "node.focus.sh-ring", style: { width: 28, height: 28, "border-color": acc, "border-width": 4 } },
      { selector: "node.dimmed", style: { opacity: 0.45 } },
      { selector: "edge", style: { width: 1.6, "line-color": "data(color)", "target-arrow-color": "data(color)", "target-arrow-shape": "triangle", "curve-style": "bezier", "line-style": "data(ls)", "arrow-scale": 0.9 } },
      { selector: "edge.order", style: { "line-color": warn, "target-arrow-color": warn, width: 2.4 } },
      { selector: "edge:selected", style: { label: "data(why)", "font-size": 10.5, color: ink, "text-background-color": bg, "text-background-opacity": 0.95, "text-wrap": "wrap", "text-max-width": 180 } }
    ];
  }
  function relsOf(id) { return [...(set.out[id] || []), ...(set.inn[id] || [])].filter(r => relOn.has(r[2])); }
  function closure(id, dir) {
    const seen = new Set([id]), stack = [id], es = [];
    while (stack.length) {
      const u = stack.pop();
      const rs = (dir === "pre" ? set.inn[u] : set.out[u]) || [];
      rs.filter(r => r[2] === "prerequisites_for").forEach(r => {
        es.push(r); const v = dir === "pre" ? r[0] : r[1];

    const cid = focus.kind === "c" ? focus.id : null;
    if (mode === "el" || focus.kind === "e") {
      const el = set.elById[focus.kind === "e" ? focus.id : set.concepts[cid].els[0][0]];
      el.c.forEach(id => ns.add(id));
      set.rels.filter(r => relOn.has(r[2]) && (ns.has(r[0]) || ns.has(r[1]))).forEach(r => es.push(r));
      es.forEach(r => { ns.add(r[0]); ns.add(r[1]); });
    } else if (mode === "pre" || mode === "post") {
      const c = closure(cid, mode); ns = c.nodes; es = c.edges;
    } else {
      ns.add(cid);
      relsOf(cid).forEach(r => { es.push(r); ns.add(r[0]); ns.add(r[1]); });
    }
    const core = focus.kind === "e" || mode === "el" ? new Set(set.elById[focus.kind === "e" ? focus.id : set.concepts[cid].els[0][0]].c) : null;
    const els = [...ns].map(id => ({ data: { id, label: set.concepts[id].n },
      classes: "sh-" + shapeOf(set.concepts[id].t) + (id === cid ? " focus" : "") + (core && !core.has(id) ? " dimmed" : "") }))
      .concat(es.map((r, i) => ({ data: { id: "e" + i, source: r[0], target: r[1], color: REL[r[2]].color, ls: REL[r[2]].style, why: `${REL[r[2]].ru}: ${r[3] || ""}` }, classes: r[4] ? "order" : "" })));
    if (!cy) {
      cy = cytoscape({ container: document.getElementById("cy"), elements: [], style: cyStyle(), wheelSensitivity: 0.25, minZoom: 0.2, maxZoom: 3 });
      cy.on("tap", "node", ev => setFocus({ kind: "c", id: ev.target.id() }, true));
    }
    cy.elements().remove(); cy.add(els);
    cy.layout({ name: "dagre", rankDir: "LR", nodeSep: 46, rankSep: 120, edgeSep: 10, animate: false, fit: true, padding: 30 }).run();
    if (cy.zoom() > 1.4) { cy.zoom(1.4); cy.center(); }
    const n = ns.size;
    const empty = (mode === "pre" || mode === "post") && es.length === 0 ? (mode === "pre" ? "У этого понятия нет предпосылок в пилотном наборе. " : "На это понятие ничего не опирается. ") : "";
    document.getElementById("hint").textContent = empty + (mode === "pre" ? "Цепочка предпосылок: всё, что нужно знать до выбранного понятия. " : mode === "post" ? "Всё, что опирается на выбранное понятие. " : "") +
      `Понятий на схеме: ${n}, связей: ${es.length}. Щелчок по узлу — перейти, по связи — объяснение. Красные связи — предпосылка в программе идёт позже.`;
  }

  // ---------- карточка
  const card = document.getElementById("card");
  function idLabel(id) {
    const m = /^(?:OOO|SOO)\.(?:history|physics)\.(?:cls\.g(\d+)\.el|(oge|ege)\.el)\.(.+)$/.exec(id);
    if (!m) return id;
    return m[1] ? `${m[1]} кл. ${m[3]}` : `${m[2] === "oge" ? "ОГЭ" : "ЕГЭ"} ${m[3]}`;
  }
  const navLink = id => `<a href="../../navigator/#${encodeURIComponent(id)}" target="_blank" rel="noopener">${esc(idLabel(id))}</a>`;
  function renderCard() {
    if (focus.kind === "e") {
      const e = set.elById[focus.id];
      card.innerHTML = `<div class="meta"><span class="chip">элемент содержания</span><span class="chip">${e.g} класс</span></div><h2>${esc(e.code)} ${esc(e.x)}</h2>
        <div class="blk"><b>Понятия (${e.c.length})</b><div class="chips">${e.c.map(id => { const c = set.concepts[id]; return `<button type="button" class="cc" data-c="${esc(id)}">${icon(c.t)}<span>${esc(c.n)}</span></button>`; }).join("")}</div></div>
        <div class="blk"><b>В приказе</b><div class="ev">${navLink(e.id)} — открыть в навигаторе</div></div>`;
      return;
    }
    const c = set.concepts[focus.id];
    let h = `<div class="meta"><span class="cc" style="cursor:default">${icon(c.t)}<span>${esc(TYPE_RU[c.t] || c.t)}</span></span>${c.g.map(g => `<span class="chip">${g} кл.</span>`).join("")}${c.ex && c.ex.length ? `<span class="chip ok">на экзамене</span>` : ""}</div>
      <h2>${esc(c.n)}</h2>`;
    if (c.a && c.a.length) h += `<div class="meta"><span class="empty">также:</span>${c.a.map(a => `<span class="chip">${esc(a)}</span>`).join("")}</div>`;
    if (c.f && c.f.length) h += `<div class="blk"><b>Формулы (из кодификатора ОГЭ/ЕГЭ)</b>${c.f.map(f => `<div class="fx">${tex(f)}</div>`).join("")}</div>`;
    if (c.d && c.d.length) h += `<div class="blk"><b>Даты</b><div>${c.d.map(esc).join("; ")}</div></div>`;
    h += `<div class="blk"><b>Где в программе — основание</b>${c.els.map(([eid, role, ev]) => `<div class="ev">${navLink(eid)} ${role === "main" ? '<span class="chip">главное</span>' : ""}<br><q>${esc(ev)}</q></div>`).join("")}</div>`;
    if (c.ex && c.ex.length) h += `<div class="blk"><b>В кодификаторе экзамена</b>${c.ex.map(([xid, ev]) => `<div class="ev">${navLink(xid)}<br><q>${esc(ev)}</q></div>`).join("")}</div>`;
    const groups = {};
    (set.out[focus.id] || []).forEach(r => (groups[r[2] + ":out"] = groups[r[2] + ":out"] || []).push([r[1], r]));
    (set.inn[focus.id] || []).forEach(r => (groups[r[2] + ":inn"] = groups[r[2] + ":inn"] || []).push([r[0], r]));
    const order = ["prerequisites_for:inn", "prerequisites_for:out", "is_a:out", "is_a:inn", "part_of:out", "part_of:inn", "participant_of:out", "participant_of:inn", "verifies:inn", "verifies:out"];
    const rows = order.filter(k => groups[k]).map(k => {
      const [t, dir] = k.split(":");
      return `<div class="blk"><b>${REL[t][dir]}</b><div class="rel">${groups[k].map(([id, r]) => `<div><button type="button" data-c="${esc(id)}">${esc(set.concepts[id].n)}</button><small>${r[4] ? '<span class="ord">в программе идёт позже · </span>' : ""}${esc(r[3] || "")}</small></div>`).join("")}</div></div>`;
    }).join("");
    h += rows || '<p class="empty">Связей с другими понятиями нет.</p>';
    card.innerHTML = h;
  }
  card.addEventListener("click", e => { const b = e.target.closest("[data-c]"); if (b) setFocus({ kind: "c", id: b.dataset.c }); });

  function setFocus(f, keepMode) {
    focus = f;
    if (f.kind === "c" && mode === "el" && !keepMode) mode = "near";
    renderCard(); drawGraph();
    listEl.querySelectorAll("[aria-current]").forEach(x => x.removeAttribute("aria-current"));
    if (f.kind === "c") {
      const b = listEl.querySelector(`[data-c="${CSS.escape(f.id)}"]`);
      if (b) { b.setAttribute("aria-current", "true"); b.scrollIntoView({ block: "nearest" }); }
      try { history.replaceState(null, "", "#" + set.key + "/" + f.id); } catch (_) {}
    }
  }

  applyTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "dark" : "light");
  const h0 = decodeURIComponent((location.hash || "").slice(1)).split("/");
  const s0 = DATA.sets.find(s => s.key === h0[0]) || DATA.sets[0];
  if (h0[1]) s0.start = h0[1];
  selectSet(s0.key);
})();
</script>
</body>
