istsipliny","C.history.istoricheskaya-hronologiya","C.history.schet-let-do-n-e-i-n-e","C.history.istoricheskaya-karta"]},{"id":"OOO.history.cls.g5.el.1.2","code":"1.2","g":5,"x":"Происхождение, расселение и эволюция древнейшего человека. Условия жизни и занятия первобытных людей. Овладение огнём. Появление человека разумного. Охота и собирательство. Присваивающее хозяйство. Род и родовые отношения. Древнейшие земледельцы и скотоводы: трудовая деятельность, изобретения. Появление ремёсел. Производящее хозяйство. Развитие обмена и торговли. Переход от родовой к соседской общине. Появление знати. Представления об окружающем мире, верования первобытных людей. Искусство первобытных людей. Разложение первобытнообщинных отношений. На пороге цивилизации","sec":"5 кл. · 1 Введение в историю. Первобытность","c":["C.history.proishozhdenie-cheloveka","C.history.rasselenie-drevneyshego-cheloveka","C.history.evolyutsiya-drevneyshego-cheloveka","C.history.zanyatiya-pervobytnyh-lyudey","C.history.ovladenie-ognem","C.history.chelovek-razumnyy","C.history.ohota","C.history.sobiratelstvo","C.history.prisvaivayuschee-hozyaystvo","C.history.rod","C.history.zemledelie","C.history.skotovodstvo","C.history.remeslo","C.history.proizvodyaschee-hozyaystvo","C.history.obmen","C.history.torgovlya","C.history.rodovaya-obschina","C.history.sosedskaya-obschina","C.history.znat","C.history.verovaniya-pervobytnyh-lyudey","C.history.iskusstvo-pervobytnyh-lyudey","C.history.razlozhenie-pervobytnoobschinnyh-otnosheniy","C.history.tsivilizatsiya"]},{"id":"OOO.history.cls.g5.el.1.3","code":"1.3","g":5,"x":"Понятие и хронологические рамки истории Древнего мира. Карта Древнего мира","sec":"5 кл. · 1 Введение в историю. Первобытность","c":["C.history.drevniy-mir","C.history.karta-drevnego-mira"]},{"id":"OOO.history.cls.g5.el.2.1","code":"2.1","g":5,"x":"Понятие «Древний Восток». Карта древневосточного мира","sec":"5 кл. · 2 Древний Восток","c":["C.history.drevniy-vostok","C.history.karta-drevnevostochnogo-mira"]},{"id":"OOO.history.cls.g5.el.2.2","code":"2.2","g":5,"x":"Древний Египет. Природа Египта. Условия жизни и занятия древних египтян. Возникновение государственной власти. Объединение Египта. Управление государством (фараон, вельможи, чиновники). Положение и повинности населения. Развитие земледелия, скотоводства, ремёсел. Рабы. Отношения Египта с соседними народами. Египетское войско. Завоевательные походы фараонов; Тутмос III. Могущество Египта при Рамсесе II. Религиозные верования египтян. Боги Древнего Египта. Храмы и жрецы. Пирамиды и гробницы. Фараон-реформатор Эхнатон. Познания древних египтян (астрономия, математика, медицина). Письменность (иероглифы, папирус). Открытие Ж.Ф. Шампольона. Искусство Древнего Египта (архитектура, рельефы, фрески)","sec":"5 кл. · 2 Древний Восток","c":["C.history.drevniy-egipet","C.history.prirodnye-usloviya-drevnego-egipta","C.history.zanyatiya-drevnih-egiptyan","C.history.vozniknovenie-gosudarstvennoy-vlasti-v-egipte","C.history.obedinenie-egipta","C.history.faraon","C.history.velmozha","C.history.chinovnik","C.history.povinnosti-naseleniya-drevnego-egipta","C.history.zemledelie","C.history.skotovodstvo","C.history.remeslo","C.history.rab","C.history.otnosheniya-egipta-s-sosednimi-narodami","C.history.egipetskoe-voysko","C.history.zavoevatelnye-pohody-faraonov","C.history.tutmos-iii","C.history.ramses-ii","C.history.religiya-drevnego-egipta","C.history.bogi-drevnego-egipta","C.history.hramy-drevnego-egipta","C.history.zhrets","C.history.egipetskie-piramidy","C.history.egipetskie-grobnitsy","C.history.ehnaton","C.history.astronomiya-drevnego-egipta","C.history.matematika-drevnego-egipta","C.history.meditsina-drevnego-egipta","C.history.pismennost","C.history.ieroglif","C.history.papirus","C.history.zh-f-shampolon","C.history.otkrytie-shampolona","C.history.iskusstvo-drevnego-egipta","C.history.arhitektura-drevnego-egipta","C.history.relef","C.history.freska"]},{"id":"OOO.history.cls.g5.el.2.3","code":"2.3","g":5,"x":"Древние цивилизации Месопотамии. Природные условия Месопотамии (Междуречья). Занятия населения. Древнейшие города-государства. Создание единого государства. Письменность. Мифы и сказания","sec":"5 кл. · 2 Древний Восток","c":["C.history.drevnyaya-mesopotamiya","C.history.prirodnye-usloviya-mesopotamii","C.history.zanyatiya-naseleniya-mesopotamii","C.history.gorod-gosudarstvo","C.history.sozdanie-edinogo-gosudarstva-v-mesopotamii","C.history.pismennost","C.history.mify-i-skazaniya-mesopotamii"]},{"id":"OOO.history.cls.g5.el.2.4","code":"2.4","g":5,"x":"Древний Вавилон. Царь Хаммурапи и его законы","sec":"5 кл. · 2 Древний Восток","c":["C.history.drevniy-vavilon","C.history.hammurapi","C.history.zakony-hammurapi"]},{"id":"OOO.history.cls.g5.el.2.5","code":"2.5","g":5,"x":"Ассирия. Завоевания ассирийцев. Создание сильной державы. Культурные сокровища Ниневии. Гибель империи","sec":"5 кл. · 2 Древний Восток","c":["C.history.assiriya","C.history.zavoevaniya-assiriytsev","C.history.sozdanie-assiriyskoy-derzhavy","C.history.nineviya","C.history.kulturnye-sokrovischa-ninevii","C.history.gibel-assiriyskoy-imperii"]},{"id":"OOO.history.cls.g5.el.2.6","code":"2.6","g":5,"x":"Усиление Нововавилонского царства. Легендарные памятники города Вавилона","sec":"5 кл. · 2 Древний Восток","c":["C.history.novovavilonskoe-tsarstvo","C.history.vavilon","C.history.legendarnye-pamyatniki-vavilona"]},{"id":"OOO.history.cls.g5.el.2.7","code":"2.7","g":5,"x":"Восточное Средиземноморье в древности. Природные условия, их влияние на занятия жителей. Финикия: развитие ремёсел, караванной и морской торговли. Города- государства. Финикийская колонизация. Финикийский алфавит","sec":"5 кл. · 2 Древний Восток","c":["C.history.vostochnoe-sredizemnomore","C.history.prirodnye-usloviya-vostochnogo-sredizemnomorya","C.history.finikiya","C.history.remeslo","C.history.karavannaya-torgovlya","C.history.morskaya-torgovlya","C.history.gorod-gosudarstvo","C.history.finikiyskaya-kolonizatsiya","C.history.finikiyskiy-alfavit"]},{"id":"OOO.history.cls.g5.el.2.8","code":"2.8","g":5,"x":"Палестина и её население. Возникновение Израильского государства. Царь Соломон. Религиозные верования. Ветхозаветные предания","sec":"5 кл. · 2 Древний Восток","c":["C.history.palestina","C.history.naselenie-palestiny","C.history.izrailskoe-gosudarstvo","C.history.solomon","C.history.religiya-drevney-palestiny","C.history.vethozavetnye-predaniya"]},{"id":"OOO.history.cls.g5.el.2.9","code":"2.9","g":5,"x":"Персидская держава. Завоевания персов. Государство Ахеменидов. Великие цари: Кир II Великий, Дарий I. Расширение территории державы. Государственное устройство. Центр и сатрапии, управление империей. Религия персов","sec":"5 кл. · 2 Древний Восток","c":["C.history.persidskaya-derzhava","C.history.zavoevaniya-persov","C.history.kir-ii-velikiy","C.history.dariy-i","C.history.rasshirenie-territorii-persidskoy-derzhavy","C.history.gosudarstvennoe-ustroystvo-persidskoy-derzhavy","C.history.satrapiya","C.history.religiya-persov"]},{"id":"OOO.history.cls.g5.el.2.10","code":"2.10","g":5,"x":"Древняя Индия. Природные условия Древней Индии. Занятия населения. Древнейшие города-государства. Приход ариев в Северную Индию. Держава Маурьев. Государство Гуптов. Общественное устройство, варны. Религиозные верования древних индийцев. Легенды и сказания. Возникновение и распространение буддизма. Культурное наследие Древней Индии (эпос и литература, художественная культура, научное познание)","sec":"5 кл. · 2 Древний Восток","c":["C.history.drevnyaya-indiya","C.history.prirodnye-usloviya-drevney-indii","C.history.zanyatiya-naseleniya-drevney-indii","C.history.gorod-gosudarstvo","C.history.arii","C.history.prihod-ariev-v-severnuyu-indiyu","C.history.derzhava-maurev","C.history.gosudarstvo-guptov","C.history.obschestvennoe-ustroystvo-drevney-indii","C.history.varna","C.history.religiya-drevney-indii","C.history.legendy-i-skazaniya-drevney-indii","C.history.buddizm","C.history.kulturnoe-nasledie-drevney-indii","C.history.epos-drevney-indii","C.history.literatura-drevney-indii","C.history.hudozhestvennaya-kultura-drevney-indii","C.history.nauchnoe-poznanie-v-drevney-indii"]},{"id":"OOO.history.cls.g5.el.2.11","code":"2.11","g":5,"x":"Древний Китай. Природные условия Древнего Китая. Хозяйственная деятельность и условия жизни населения. Древнейшие царства. Создание объединённой империи. Цинь Шихуанди. Возведение Великой Китайской стены. Правление династии Хань. Жизнь в империи: правители и подданные, положение различных групп населения. Развитие ремёсел и торговли. Великий шёлковый путь. Религиозно- философские учения. Конфуций. Научные знания и изобретения древних китайцев. Храмы","sec":"5 кл. · 2 Древний Восток","c":["C.history.drevniy-kitay","C.history.prirodnye-usloviya-drevnego-kitaya","C.history.hozyaystvennaya-deyatelnost-v-drevnem-kitae","C.history.drevneyshie-tsarstva-kitaya","C.history.sozdanie-obedinennoy-imperii-v-kitae","C.history.tsin-shihuandi","C.history.velikaya-kitayskaya-stena","C.history.dinastiya-han","C.history.zhizn-v-imperii-drevnego-kitaya","C.history.remeslo","C.history.torgovlya","C.history.velikiy-shelkovyy-put","C.history.religiozno-filosofskie-ucheniya-drevnego-kitaya","C.history.konfutsiy","C.history.nauchnye-znaniya-drevnih-kitaytsev","C.history.izobreteniya-drevnih-kitaytsev","C.history.hramy-drevnego-kitaya"]},{"id":"OOO.history.cls.g5.el.3.1","code":"3.1","g":5,"x":"Древнейшая Греция. Природные условия Древней Греции. Занятия населения. Древнейшие государства на Крите. Расцвет и гибель Минойской цивилизации. Государства Ахейской Греции (Микены, Тиринф). Троянская война. Вторжение дорийских племён. Поэмы Гомера «Илиада», «Одиссея»","sec":"5 кл. · 3 Древняя Греция. Эллинизм","c":["C.history.drevneyshaya-gretsiya","C.history.prirodnye-usloviya-drevney-gretsii","C.history.zanyatiya-naseleniya-drevney-gretsii","C.history.krit","C.history.minoyskaya-tsivilizatsiya","C.history.gibel-minoyskoy-tsivilizatsii","C.history.aheyskaya-gretsiya","C.history.mikeny","C.history.tirinf","C.history.troyanskaya-voyna","C.history.doriytsy","C.history.vtorzhenie-doriyskih-plemen","C.history.gomer","C.history.iliada","C.history.odisseya"]},{"id":"OOO.history.cls.g5.el.3.2","code":"3.2","g":5,"x":"Греческие полисы. Подъём хозяйственной жизни после «тёмных веков». Развитие земледелия и ремесла. Становление полисов, их политическое устройство. Аристократия и демос. Великая греческая колонизация. Метрополии и колонии. Афины: утверждение демократии. Законы Солона. Реформы Клисфена, их значение. Спарта: основные группы населения, политическое устройство. Организация военного дела. Спартанское воспитание","sec":"5 кл. · 3 Древняя Греция. Эллинизм","c":["C.history.polis","C.history.podem-hozyaystvennoy-zhizni-v-gretsii","C.history.temnye-veka","C.history.zemledelie","C.history.remeslo","C.history.stanovlenie-polisov","C.history.politicheskoe-ustroystvo-polisov","C.history.aristokratiya","C.history.demos","C.history.velikaya-grecheskaya-kolonizatsiya","C.history.metropoliya","C.history.koloniya","C.history.afiny","C.history.demokratiya","C.history.solon","C.history.zakony-solona","C.history.klisfen","C.history.reformy-klisfena","C.history.sparta","C.history.gruppy-naseleniya-sparty","C.history.politicheskoe-ustroystvo-sparty","C.history.voennoe-delo-v-sparte","C.history.spartanskoe-vospitanie"]},{"id":"OOO.history.cls.g5.el.3.3","code":"3.3","g":5,"x":"Греко-персидские войны. Причины войн. Походы персов на Грецию. Битва при Марафоне, её значение. Усиление афинского могущества; Фемистокл. Битва при Фермопилах. Захват персами Аттики. Победы греков в Саламинском сражении, при Платеях и Микале. Итоги греко-персидских войн","sec":"5 кл. · 3 Древняя Греция. Эллинизм","c":["C.history.greko-persidskie-voyny","C.history.pohody-persov-na-gretsiyu","C.history.bitva-pri-marafone","C.history.femistokl","C.history.bitva-pri-fermopilah","C.history.zahvat-persami-attiki","C.history.attika","C.history.salaminskoe-srazhenie","C.history.bitva-pri-plateyah","C.history.bitva-pri-mikale"]},{"id":"OOO.history.cls.g5.el.3.4","code":"3.4","g":5,"x":"Возвышение Афинского государства. Афины при Перикле. Хозяйственная жизнь. Развитие рабовладения. Пелопоннесская война: причины, участники, итоги. Упадок Эллады","sec":"5 кл. · 3 Древняя Греция. Эллинизм","c":["C.history.afiny","C.history.perikl","C.history.hozyaystvennaya-zhizn-afin","C.history.rabovladenie","C.history.peloponnesskaya-voyna","C.history.upadok-ellady"]},{"id":"OOO.history.cls.g5.el.3.5","code":"3.5","g":5,"x":"Культура Древней Греции. Религия древних греков; пантеон богов. Храмы и жрецы. Развитие наук. Греческая философия. Школа и образование. Литература. Греческое искусство: архитектура, скульптура. Повседневная жизнь и быт древних греков. Досуг (театр, спортивные состязания). Общегреческие игры в Олимпии","sec":"5 кл. · 3 Древняя Греция. Эллинизм","c":["C.history.kultura-drevney-gretsii","C.history.religiya-drevney-gretsii","C.history.panteon-grecheskih-bogov","C.history.hramy-drevney-gretsii","C.history.zhrets","C.history.nauka-drevney-gretsii","C.history.grecheskaya-filosofiya","C.history.obrazovanie-v-drevney-gretsii","C.history.literatura-drevney-gretsii","C.history.grecheskoe-iskusstvo","C.history.arhitektura-drevney-gretsii","C.history.skulptura-drevney-gretsii","C.history.povsednevnaya-zhizn-drevnih-grekov","C.history.teatr-drevney-gretsii","C.history.sportivnye-sostyazaniya-v-drevney-gretsii","C.history.olimpiyskie-igry","C.history.olimpiya"]},{"id":"OOO.history.cls.g5.el.3.6","code":"3.6","g":5,"x":"Македонские завоевания. Эллинизм. Возвышение Македонии. Политика Филиппа II. Главенство Македонии над греческими полисами. Коринфский союз. Александр Македонский и его завоевания на Востоке. Распад державы Александра Македонского. Эллинистические государства Востока. Культура эллинистического мира. Александрия Египетская","sec":"5 кл. · 3 Древняя Греция. Эллинизм","c":["C.history.makedonskie-zavoevaniya","C.history.ellinizm","C.history.makedoniya","C.history.filipp-ii","C.history.glavenstvo-makedonii-nad-grecheskimi-polisami","C.history.korinfskiy-soyuz","C.history.aleksandr-makedonskiy","C.history.zavoevaniya-aleksandra-makedonskogo","C.history.derzhava-aleksandra-makedonskogo","C.history.raspad-derzhavy-aleksandra-makedonskogo","C.history.ellinisticheskie-gosudarstva-vostoka","C.history.kultura-ellinisticheskogo-mira","C.history.aleksandriya-egipetskaya"]},{"id":"OOO.history.cls.g5.el.4.1","code":"4.1","g":5,"x":"Возникновение Римского государства. Природа и население Апеннинского полуострова в древности. Этрусские города-государства. Наследие этрусков. Легенды об основании Рима. Рим эпохи царей. Республика римских граждан. Патриции и плебеи. Управление и законы. Римское войско. Верования древних римлян. Боги. Жрецы. Завоевание Римом Италии","sec":"5 кл. · 4 Древний Рим","c":["C.history.drevniy-rim","C.history.apenninskiy-poluostrov","C.history.naselenie-apenninskogo-poluostrova","C.history.etruski","C.history.nasledie-etruskov","C.history.legendy-ob-osnovanii-rima","C.history.rim-epohi-tsarey","C.history.rimskaya-respublika","C.history.patritsiy","C.history.plebey","C.history.upravlenie-v-rimskoy-respublike","C.history.rimskie-zakony","C.history.rimskoe-voysko","C.history.religiya-drevnego-rima","C.history.bogi-drevnego-rima","C.history.zhrets","C.history.zavoevanie-rimom-italii"]},{"id":"OOO.history.cls.g5.el.4.2","code":"4.2","g":5,"x":"Римские завоевания в Средиземноморье. Войны Рима с Карфагеном. Ганнибал; битва при Каннах. Поражение Карфагена. Установление господства Рима в Средиземноморье. Римские провинции","sec":"5 кл. · 4 Древний Рим","c":["C.history.rimskie-zavoevaniya-v-sredizemnomore","C.history.sredizemnomore","C.history.punicheskie-voyny","C.history.karfagen","C.history.gannibal","C.history.bitva-pri-kannah","C.history.porazhenie-karfagena","C.history.ustanovlenie-gospodstva-rima-v-sredizemnomore","C.history.rimskaya-provintsiya"]},{"id":"OOO.history.cls.g5.el.4.3","code":"4.3","g":5,"x":"Поздняя Римская республика. Гражданские войны. Подъём сельского хозяйства. Латифундии. Рабство. Борьба за аграрную реформу. Деятельность братьев Гракхов: проекты реформ, мероприятия, итоги. Гражданская война и установление диктатуры Суллы. Восстание Спартака. Участие армии в гражданских войнах. Первый триумвират. Гай Юлий Цезарь: путь к власти, диктатура. Борьба между наследниками Цезаря. Победа Октавиана","sec":"5 кл. · 4 Древний Рим","c":["C.history.pozdnyaya-rimskaya-respublika","C.history.grazhdanskie-voyny-v-rime","C.history.podem-selskogo-hozyaystva-v-rime","C.history.latifundiya","C.history.rabstvo","C.history.agrarnaya-reforma-v-rime","C.history.bratya-grakhi","C.history.sulla","C.history.diktatura-sully","C.history.spartak","C.history.vosstanie-spartaka","C.history.rimskoe-voysko","C.history.pervyy-triumvirat","C.history.gay-yuliy-tsezar","C.history.diktatura-tsezarya","C.history.borba-mezhdu-naslednikami-tsezarya","C.history.oktavian-avgust","C.history.pobeda-oktaviana"]},{"id":"OOO.history.cls.g5.el.4.4","code":"4.4","g":5,"x":"Расцвет и падение Римской империи. Установление императорской власти. Октавиан Август. Императоры Рима: завоеватели и правители. Римская империя: территория, управление. Римское гражданство. Повседневная жизнь в столице и провинциях. Возникновение и распространение христианства. Император Константин I, перенос столицы в Константинополь. Разделение Римской империи на Западную и Восточную части. Начало Великого переселения народов. Рим и варвары. Падение Западной Римской империи","sec":"5 кл. · 4 Древний Рим","c":["C.history.rimskaya-imperiya","C.history.ustanovlenie-imperatorskoy-vlasti-v-rime","C.history.oktavian-avgust","C.history.rimskiy-imperator","C.history.territoriya-rimskoy-imperii","C.history.upravlenie-rimskoy-imperiey","C.history.rimskoe-grazhdanstvo","C.history.povsednevnaya-zhizn-v-rimskoy-imperii","C.history.hristianstvo","C.history.konstantin-i","C.history.perenos-stolitsy-v-konstantinopol","C.history.konstantinopol","C.history.razdelenie-rimskoy-imperii","C.history.vostochnaya-rimskaya-imperiya","C.history.zapadnaya-rimskaya-imperiya","C.history.velikoe-pereselenie-narodov","C.history.varvary","C.history.padenie-zapadnoy-rimskoy-imperii"]},{"id":"OOO.history.cls.g5.el.4.5","code":"4.5","g":5,"x":"Культура Древнего Рима. Римская литература, золотой век поэзии. Ораторское искусство; Цицерон. Развитие наук. Римские историки. Искусство Древнего Рима: архитектура, скульптура. Пантеон","sec":"5 кл. · 4 Древний Рим","c":["C.history.kultura-drevnego-rima","C.history.rimskaya-literatura","C.history.zolotoy-vek-rimskoy-poezii","C.history.oratorskoe-iskusstvo","C.history.tsitseron","C.history.nauka-drevnego-rima","C.history.rimskie-istoriki","C.history.iskusstvo-drevnego-rima","C.history.arhitektura-drevnego-rima","C.history.skulptura-drevnego-rima","C.history.panteon"]},{"id":"OOO.history.cls.g5.el.4.6","code":"4.6","g":5,"x":"Историческое и культурное наследие цивилизаций Древнего мира","sec":"5 кл. · 4 Древний Рим","c":["C.history.nasledie-tsivilizatsiy-drevnego-mira","C.history.drevniy-mir"]},{"id":"OOO.history.cls.g6.el.1.1","code":"1.1","g":6,"x":"Средние века: понятие, хронологические рамки и периодизация Средневековья","sec":"6 кл. · 1 Всеобщая история. История Средних веков","c":["C.history.srednie-veka","C.history.periodizatsiya-srednevekovya"]},{"id":"OOO.history.cls.g6.el.1.2","code":"1.2","g":6,"x":"Народы Европы в раннее Средневековье. Падение Западной Римской империи и образование варварских королевств. Завоевание франками Галлии. Хлодвиг. Усиление королевской власти. Салическая правда. Принятие франками христианства. Франкское государство в VIII‒IX вв. Усиление власти майордомов. Карл Мартелл и его военная реформа. Завоевания Карла Великого. Управление империей. «Каролингское возрождение». Верденский раздел, его причины и значение. Образование государств во Франции, Германии, Италии. Священная Римская империя. Британия и Ирландия в раннее Средневековье. Норманны: общественный строй, завоева zantii","C.history.obrazovanie-v-vizantii","C.history.knizhnoe-delo-v-vizantii","C.history.hudozhestvennaya-kultura-vizantii","C.history.arhitektura-vizantii","C.history.mozaika","C.history.freska","C.history.ikonopis"]},{"id":"OOO.history.cls.g6.el.1.4","code":"1.4","g":6,"x":"Арабы в VI‒ХI вв. Природные условия Аравийского полуострова. Основные занятия арабов. Традиционные верования. Пророк Мухаммад и возникновение ислама. Хиджра. Победа новой веры. Коран. Завоевания арабов. Арабский халифат, его расцвет и распад. Культура исламского мира. Образование и наука. Роль арабского языка. Расцвет литературы и искусства. Архитектура","sec":"6 кл. · 1 Всеобщая история. История Средних веков","c":["C.history.araby","C.history.prirodnye-usloviya-araviyskogo-poluostrova","C.history.zanyatiya-arabov","C.history.traditsionnye-verovaniya-arabov","C.history.muhammad","C.history.islam","C.history.hidzhra","C.history.pobeda-islama-v-aravii","C.history.koran","C.history.zavoevaniya-arabov","C.history.arabskiy-halifat","C.history.raspad-arabskogo-halifata","C.history.kultura-islamskogo-mira","C.history.obrazovanie-v-islamskom-mire","C.history.nauka-islamskogo-mira","C.history.arabskiy-yazyk","C.history.literatura-islamskogo-mira","C.history.iskusstvo-islamskogo-mira","C.history.arhitektura-islamskogo-mira"]},{"id":"OOO.history.cls.g6.el.1.5","code":"1.5","g":6,"x":"Средневековое европейское общество. Аграрное производство. Натуральное хозяйство. Феодальное землевладение. Знать и рыцарство: социальный статус, образ жизни. Замок сеньора. Куртуазная культура. Крестьянство: зависимость от сеньора, повинности, условия жизни. Крестьянская община. Города ‒ центры ремесла, торговли, культуры. Население городов. Цехи и гильдии. Городское управление. Борьба городов за самоуправление. Средневековые города-республики. Развитие торговли. Ярмарки. Торговые пути в Средиземноморье и на Балтике. Ганза. Облик средневековых городов. Образ жизни и быт горожан. Церковь и духовенство. Разделение христианства на католицизм и православие. Борьба пап за независимость церкви от светской власти. Крестовые походы: цели, участники, итоги. Духовно-рыцарские ордены. Ереси: причины возникновения и распространения. Преследование еретиков","sec":"6 кл. · 1 Всеобщая история. История Средних веков","c":["C.history.srednevekovoe-evropeyskoe-obschestvo","C.history.agrarnoe-proizvodstvo","C.history.naturalnoe-hozyaystvo","C.history.feodalnoe-zemlevladenie","C.history.znat","C.history.rytsarstvo","C.history.senor","C.history.zamok-senora","C.history.kurtuaznaya-kultura","C.history.krestyanstvo","C.history.feodalnaya-zavisimost-krestyan","C.history.povinnosti-krestyan","C.history.krestyanskaya-obschina","C.history.srednevekovyy-gorod","C.history.remeslo","C.history.gorozhane","C.history.tseh","C.history.gildiya","C.history.gorodskoe-upravlenie","C.history.borba-gorodov-za-samoupravlenie","C.history.gorod-respublika","C.history.torgovlya","C.history.yarmarka","C.history.torgovye-puti-v-sredizemnomore-i-na-baltike","C.history.ganza","C.history.byt-srednevekovyh-gorozhan","C.history.tserkov","C.history.duhovenstvo","C.history.razdelenie-hristianstva-na-katolitsizm-i-pravoslavie","C.history.katolitsizm","C.history.pravoslavie","C.history.borba-pap-za-nezavisimost-tserkvi-ot-svetskoy-vlasti","C.history.krestovye-pohody","C.history.duhovno-rytsarskiy-orden","C.history.eres","C.history.presledovanie-eretikov"]},{"id":"OOO.history.cls.g6.el.1.6","code":"1.6","g":6,"x":"Государства Европы в ХII‒ХV вв. Усиление королевской власти в странах Западной Европы. Сословно- представительная монархия. Образование централизованных государств в Англии, Франции. Столетняя война; Ж. Д’Арк. Священная Римская империя в ХII‒ХV вв. Польско-литовское государство в XIV‒XV вв. Реконкиста и образование централизованных государств на Пиренейском полуострове. Итальянские государства в XII‒XV вв. Развитие экономики в европейских странах в период зрелого Средневековья. Обострение социальных противоречий в ХIV в. (Жакерия, восстание Уота Тайлера). Гуситское движение в Чехии. Византийская империя и славянские государства в ХII‒ХV вв. Экспансия турок-османов. Османские завоевания на Балканах. Падение Константинополя","sec":"6 кл. · 1 Всеобщая история. История Средних веков","c":["C.history.tsentralizovannoe-gosudarstvo","C.history.usilenie-korolevskoy-vlasti","C.history.soslovno-predstavitelnaya-monarhiya","C.history.angliya","C.history.frantsiya","C.history.stoletnyaya-voyna","C.history.zhanna-d-ark","C.history.svyaschennaya-rimskaya-imperiya","C.history.polsko-litovskoe-gosudarstvo","C.history.rekonkista","C.history.pireneyskiy-poluostrov","C.history.italyanskie-gosudarstva","C.history.zreloe-srednevekove","C.history.obostrenie-sotsialnyh-protivorechiy-v-xiv-veke","C.history.zhakeriya","C.history.vosstanie-uota-taylera","C.history.uot-tayler","C.history.gusitskoe-dvizhenie","C.history.vostochnaya-rimskaya-imperiya","C.history.slavyanskie-gosudarstva","C.history.turki-osmany","C.history.osmanskie-zavoevaniya","C.history.balkany","C.history.padenie-konstantinopolya"]},{"id":"OOO.history.cls.g6.el.1.7","code":"1.7","g":6,"x":"Культура средневековой Европы. Представления средневекового человека о мире. Место религии в жизни человека и общества. Образование: школы и университеты. Сословный характер культуры. Средневековый эпос. Рыцарская литература. Городской и крестьянский фольклор. Романский и готический стили в художественной культуре. Развитие знаний о природе и человеке. Гуманизм. Раннее Возрождение: художники и их творения. Изобретение европейского книгопечатания; И. Гутенберг","sec":"6 кл. · 1 Всеобщая история. История Средних веков","c":["C.history.kultura-srednevekovoy-evropy","C.history.kartina-mira-srednevekovogo-cheloveka","C.history.obrazovanie-v-srednevekovoy-evrope","C.history.universitet","C.history.soslovie","C.history.srednevekovyy-epos","C.history.rytsarskaya-literatura","C.history.srednevekovyy-folklor","C.history.romanskiy-stil","C.history.goticheskiy-stil","C.history.srednevekovaya-nauka","C.history.gumanizm","C.history.rannee-vozrozhdenie","C.history.izobretenie-knigopechataniya","C.history.i-gutenberg"]},{"id":"OOO.history.cls.g6.el.1.8","code":"1.8","g":6,"x":"Страны Востока в Средние века. Османская империя: завоевания турок-османов (Балканы, падение Византии), управление империей, положение покорённых народов. Монгольская держава: общественный строй монгольских племен, завоевания Чингисхана и его потомков, управление подчинёнными территориями. Китай: империи, правители и подданные, борьба против завоевателей. Япония в Средние века: образование государства, власть императоров и управление сёгунов. Индия: раздробленность индийских княжеств, вторжение мусульман, Делийский султанат. Культура народов Востока. Литература. Архитектура. Традиционные искусства и ремесла","sec":"6 кл. · 1 Всеобщая история. История Средних веков","c":["C.history.srednevekovyy-vostok","C.history.osmanskaya-imperiya","C.history.osmanskie-zavoevaniya","C.history.turki-osmany","C.history.balkany","C.history.padenie-konstantinopolya","C.history.upravlenie-osmanskoy-imperiey","C.history.polozhenie-pokorennyh-narodov-v-osmanskoy-imperii","C.history.mongolskaya-imperiya","C.history.mongoly","C.history.obschestvennyy-stroy-mongolskih-plemen","C.history.mongolskie-zavoevaniya","C.history.chingishan","C.history.upravlenie-mongolskoy-imperiey","C.history.srednevekovyy-kitay","C.history.borba-kitaya-protiv-zavoevateley","C.history.srednevekovaya-yaponiya","C.history.segun","C.history.srednevekovaya-indiya","C.history.razdroblennost-indiyskih-knyazhestv","C.history.vtorzhenie-musulman-v-indiyu","C.history.deliyskiy-sultanat","C.history.kultura-narodov-vostoka","C.history.literatura-narodov-vostoka","C.history.arhitektura-narodov-vostoka","C.history.traditsionnye-iskusstva-i-remesla-narodov-vostoka"]},{"id":"OOO.history.cls.g6.el.1.9","code":"1.9","g":6,"x":"Государства доколумбовой Америки в Средние века. Цивилизации майя, ацтеков и инков: общественный строй, религиозные верования, культура. Появление европейских завоевателей","sec":"6 кл. · 1 Всеобщая история. История Средних веков","c":["C.history.dokolumbova-amerika","C.history.mayya","C.history.atsteki","C.history.inki","C.history.obschestvennyy-stroy-narodov-dokolumbovoy-ameriki","C.history.religioznye-verovaniya-narodov-dokolumbovoy-ameriki","C.history.kultura-narodov-dokolumbovoy-ameriki","C.history.poyavlenie-evropeyskih-zavoevateley-v-amerike"]},{"id":"OOO.history.cls.g6.el.1.10","code":"1.10","g":6,"x":"Историческое и культурное наследие Средних веков","sec":"6 кл. · 1 Всеобщая история. История Средних веков","c":["C.history.nasledie-srednih-vekov"]},{"id":"OOO.history.cls.g6.el.2.1","code":"2.1","g":6,"x":"Роль и место России в мировой истории. Проблемы периодизации российской истории. Источники по истории России","sec":"6 кл. · 2 Введение в историю России. Народы и государства на территории нашей страны в древности. Восточная Европа в середине I тыс. н.э.","c":["C.history.rossiya","C.history.periodizatsiya-rossiyskoy-istorii","C.history.istochniki-po-istorii-rossii"]},{"id":"OOO.history.cls.g6.el.2.2","code":"2.2","g":6,"x":"Народы и государства на территории нашей страны в древности. Восточная Европа в середине I тыс. н.э. Заселение территории нашей страны человеком. Палеолитическое искусство. Петроглифы Беломорья и Онежского озера. Особенности перехода от присваивающего хозяйства к производящему. Ареалы древнейшего земледелия и скотоводства. Появление металлических орудий и их влияние на первобытное общество. Центры древнейшей металлургии. Кочевые общества евразийских степей в эпоху бронзы и раннем железном веке. Степь и её роль в распространении культурных взаимовлияний. Появление первого в мире колёсного транспорта. Народы, проживавшие на этой территории до середины I тыс. до н. э. Скифы и скифская культура. Античные города-государства Северного Причерноморья. Боспорское царство. Пантикапей. Античный Херсонес. Скифское царство в Крыму. Дербент. Великое переселение народов. Миграция готов. Нашествие гуннов. Вопрос о славянской прародине и происхождении славян. Расселение славян, их разделение на три ветви ‒ восточных, западных и южных. Славянские общности Восточной Европы. Их соседи ‒ балты и финно-угры. Хозяйство восточных славян, их общественный строй и политическая организация. Возникновение княжеской власти. Традиционные верования. Страны и народы Восточной Европы, Сибири и Дальнего Востока. Тюркский каганат. Хазарский каганат. Волжская Булгария","sec":"6 кл. · 2 Введение в историю России. Народы и государства на территории нашей страны в древности. Восточная Европа в середине I тыс. н.э.","c":["C.history.narody-i-gosudarstva-na-territorii-rossii-v-drevnosti","C.history.vostochnaya-evropa","C.history.zaselenie-territorii-rossii-chelovekom","C.history.paleoliticheskoe-iskusstvo","C.history.petroglify-belomorya-i-onezhskogo-ozera","C.history.perehod-ot-prisvaivayuschego-hozyaystva-k-proizvodyaschemu","C.history.arealy-drevneyshego-zemledeliya-i-skotovodstva","C.history.metallicheskie-orudiya","C.history.pervobytnoe-obschestvo","C.history.tsentry-drevneyshey-metallurgii","C.history.kochevye-obschestva-evraziyskih-stepey","C.history.evraziyskaya-step","C.history.poyavlenie-kolesnogo-transporta","C.history.skify","C.history.skifskaya-kultura","C.history.antichnye-goroda-gosudarstva-severnogo-prichernomorya","C.history.severnoe-prichernomore","C.history.bosporskoe-tsarstvo","C.history.pantikapey","C.history.hersones","C.history.skifskoe-tsarstvo-v-krymu","C.history.krym","C.history.derbent","C.history.velikoe-pereselenie-narodov","C.history.migratsiya-gotov","C.history.goty","C.history.nashestvie-gunnov","C.history.gunny","C.history.slavyanskaya-prarodina","C.history.proishozhdenie-slavyan","C.history.slavyane","C.history.rasselenie-slavyan","C.history.vostochnye-slavyane","C.history.zapadnye-slavyane","C.history.yuzhnye-slavyane","C.history.slavyanskie-obschnosti-vostochnoy-evropy","C.history.balty","C.history.finno-ugry","C.history.hozyaystvo-vostochnyh-slavyan","C.history.obschestvennyy-stroy-vostochnyh-slavyan","C.history.politicheskaya-organizatsiya-vostochnyh-slavyan","C.history.knyaz","C.history.traditsionnye-verovaniya-vostochnyh-slavyan","C.history.sibir","C.history.dalniy-vostok","C.history.tyurkskiy-kaganat","C.history.hazarskiy-kaganat","C.history.volzhskaya-bulgariya"]},{"id":"OOO.history.cls.g6.el.3.1","code":"3.1","g":6,"x":"Образование государства Русь. Исторические условия складывания русской государственности: природно-климатический фактор и политические процессы в Европе в конце I тыс. н. э. Формирование новой политической и этнической карты континента. Первые известия о Руси. Проблема образования государства Русь. Скандинавы на Руси. Начало династии Рюриковичей. Формирование территории государства Русь. Дань и полюдье. Первые русские князья. Языческий пантеон","sec":"6 кл. · 3 Русь в IX ‒ начале XII в.","c":["C.history.obrazovanie-gosudarstva-rus","C.history.rus","C.history.usloviya-skladyvaniya-russkoy-gosudarstvennosti","C.history.formirovanie-politicheskoy-i-etnicheskoy-karty-evropy","C.history.pervye-izvestiya-o-rusi","C.history.normanny","C.history.dinastiya-ryurikovichey","C.history.formirovanie-territorii-gosudarstva-rus","C.history.dan","C.history.polyude","C.history.pervye-russkie-knyazya","C.history.yazycheskiy-panteon"]},{"id":"OOO.history.cls.g6.el.3.2","code":"3.2","g":6,"x":"Отношения Руси с Византийской империей, странами Центральной, Западной и Северной Европы, кочевниками европейских степей в IX– X вв. Русь в международной торговле. Путь «из варяг в греки». Волжский торговый путь","sec":"6 кл. · 3 Русь в IX ‒ начале XII в.","c":["C.history.vneshnyaya-politika-rusi","C.history.vostochnaya-rimskaya-imperiya","C.history.kochevniki-evropeyskih-stepey","C.history.mezhdunarodnaya-torgovlya-rusi","C.history.put-iz-varyag-v-greki","C.history.volzhskiy-torgovyy-put"]},{"id":"OOO.history.cls.g6.el.3.3","code":"3.3","g":6,"x":"Принятие христианства и его pravo","C.history.russkaya-pravda","C.history.tserkovnye-ustavy"]},{"id":"OOO.history.cls.g6.el.3.8","code":"3.8","g":6,"x":"Русь в социально-политическом контексте Евразии. Внешняя политика и международные связи Руси в конце X ‒ начале XII в.: отношения с Византией, печенегами, половцами (Дешт-и-Кипчак), странами Центральной, Западной и Северной Европы. Херсонес в культурных контактах Руси и Византии","sec":"6 кл. · 3 Русь в IX ‒ начале XII в.","c":["C.history.vneshnyaya-politika-rusi","C.history.vostochnaya-rimskaya-imperiya","C.history.pechenegi","C.history.polovtsy","C.history.desht-i-kipchak","C.history.hersones"]},{"id":"OOO.history.cls.g6.el.3.9","code":"3.9","g":6,"x":"Культурное пространство. Русь в общеевропейском культурном контексте. Картина мира средневекового человека. Повседневная жизнь, сельский и городской быт. Положение женщины. Дети и их воспитание. Календарь и хронология. Культура Руси. Формирование единого культурного пространства. Кирилло- мефодиевская традиция на Руси. Письменность. Распространение грамотности, берестяные грамоты. «Новгородская псалтирь». «Остромирово Евангелие». Появление древнерусской литературы. «Слово о Законе и Благодати». Произведения летописного жанра. «Повесть временных лет». Первые русские жития. Произведения Владимира Мономаха. Иконопись. Искусство книги. Архитектура. Начало храмового строительства: Десятинная церковь, София Киевская, София Новгородская. Материальная культура. Ремесло. Военное дело и оружие","sec":"6 кл. · 3 Русь в IX ‒ начале XII в.","c":["C.history.kultura-rusi","C.history.kartina-mira-srednevekovogo-cheloveka","C.history.povsednevnaya-zhizn-na-rusi","C.history.polozhenie-zhenschiny-na-rusi","C.history.vospitanie-detey-na-rusi","C.history.drevnerusskiy-kalendar","C.history.formirovanie-edinogo-kulturnogo-prostranstva-rusi","C.history.kirillo-mefodievskaya-traditsiya","C.history.pismennost","C.history.rasprostranenie-gramotnosti","C.history.berestyanye-gramoty","C.history.novgorodskaya-psaltir","C.history.ostromirovo-evangelie","C.history.drevnerusskaya-literatura","C.history.slovo-o-zakone-i-blagodati","C.history.letopis","C.history.povest-vremennyh-let","C.history.zhitiynaya-literatura","C.history.proizvedeniya-vladimira-monomaha","C.history.ikonopis","C.history.iskusstvo-knigi-na-rusi","C.history.drevnerusskaya-arhitektura","C.history.hramovoe-stroitelstvo-na-rusi","C.history.desyatinnaya-tserkov","C.history.sofiya-kievskaya","C.history.sofiya-novgorodskaya","C.history.materialnaya-kultura-rusi","C.history.remeslo","C.history.voennoe-delo-na-rusi"]},{"id":"OOO.history.cls.g6.el.4.1","code":"4.1","g":6,"x":"Формирование системы земель ‒ самостоятельных государств. Важнейшие земли, управляемые ветвями княжеского рода Рюриковичей: Черниговская, Смоленская, Галицкая, Волынская, Суздальская. Земли, имевшие особый статус: Киевская и Новгородская. Эволюция общественного строя и права; внешняя политика русских земель","sec":"6 кл. · 4 Русь в середине XII ‒ начале XIII в.","c":["C.history.formirovanie-sistemy-russkih-zemel","C.history.russkie-zemli","C.history.dinastiya-ryurikovichey","C.history.chernigovskaya-zemlya","C.history.smolenskaya-zemlya","C.history.galitskaya-zemlya","C.history.volynskaya-zemlya","C.history.suzdalskaya-zemlya","C.history.kievskaya-zemlya","C.history.novgorodskaya-zemlya","C.history.obschestvennyy-stroy-rusi","C.history.drevnerusskoe-pravo","C.history.vneshnyaya-politika-rusi"]},{"id":"OOO.history.cls.g6.el.4.2","code":"4.2","g":6,"x":"Формирование региональных центров культуры. Летописание и памятники литературы: Киево-Печерский патерик, моление Даниила Заточника, «Слово о полку Игореве». Белокаменные храмы Северо- Восточной Руси: Успенский собор во Владимире, церковь Покрова на Нерли, Георгиевский собор Юрьева-Польского","sec":"6 кл. · 4 Русь в середине XII ‒ начале XIII в.","c":["C.history.regionalnye-tsentry-kultury","C.history.letopis","C.history.drevnerusskaya-literatura","C.history.kievo-pecherskiy-paterik","C.history.molenie-daniil мли и их соседи в середине XIII ‒ XIV в.","c":["C.history.borba-rusi-s-ekspansiey-krestonostsev","C.history.duhovno-rytsarskiy-orden","C.history.aleksandr-nevskiy"]},{"id":"OOO.history.cls.g6.el.5.5","code":"5.5","g":6,"x":"Взаимоотношения Руси с Ордой. Княжества Северо-Восточной Руси. Борьба за великое княжение Владимирское. Противостояние Твери и Москвы","sec":"6 кл. · 5 Русские земли и их соседи в середине XIII ‒ XIV в.","c":["C.history.otnosheniya-rusi-s-ordoy","C.history.zolotaya-orda","C.history.severo-vostochnaya-rus","C.history.velikoe-knyazhenie-vladimirskoe","C.history.protivostoyanie-tveri-i-moskvy","C.history.tverskoe-knyazhestvo","C.history.moskovskoe-knyazhestvo"]},{"id":"OOO.history.cls.g6.el.5.6","code":"5.6","g":6,"x":"Усиление Московского княжества. Дмитрий Донской. Куликовская битва. Закрепление первенствующего положения московских князей","sec":"6 кл. · 5 Русские земли и их соседи в середине XIII ‒ XIV в.","c":["C.history.usilenie-moskovskogo-knyazhestva","C.history.moskovskoe-knyazhestvo","C.history.dmitriy-donskoy","C.history.kulikovskaya-bitva","C.history.zakreplenie-pervenstva-moskovskih-knyazey"]},{"id":"OOO.history.cls.g6.el.5.7","code":"5.7","g":6,"x":"Перенос митрополичьей кафедры в Москву. Роль Православной церкви в ордынский период русской истории. Святитель Алексий Московский и преподобный Сергий Радонежский","sec":"6 кл. · 5 Русские земли и их соседи в середине XIII ‒ XIV в.","c":["C.history.perenos-mitropolichey-kafedry-v-moskvu","C.history.moskva","C.history.russkaya-tserkov","C.history.aleksiy-moskovskiy","C.history.sergiy-radonezhskiy"]},{"id":"OOO.history.cls.g6.el.5.8","code":"5.8","g":6,"x":"Народы и государства степной зоны Восточной Европы и Сибири в XIII‒XV вв. Золотая орда: государственный строй, население, экономика, культура. Города и кочевые степи. Принятие ислама. Ослабление государства во второй половине XIV в., нашествие Тимура","sec":"6 кл. · 5 Русские земли и их соседи в середине XIII ‒ XIV в.","c":["C.history.zolotaya-orda","C.history.narody-i-gosudarstva-stepnoy-zony-vostochnoy-evropy-i-sibiri","C.history.gosudarstvennyy-stroy-zolotoy-ordy","C.history.naselenie-zolotoy-ordy","C.history.ekonomika-zolotoy-ordy","C.history.kultura-zolotoy-ordy","C.history.goroda-zolotoy-ordy","C.history.prinyatie-islama-v-zolotoy-orde","C.history.oslablenie-zolotoy-ordy","C.history.nashestvie-timura","C.history.timur"]},{"id":"OOO.history.cls.g6.el.5.9","code":"5.9","g":6,"x":"Распад Золотой Орды, образование татарских ханств. Казанское ханство. Сибирское ханство. Астраханское ханство. Ногайская Орда. Крымское ханство. Касимовское ханство. Народы Северного Кавказа. Итальянские фактории Причерноморья (Каффа, Тана, Солдайя и другие) и их роль в системе торговых и политических связей Руси с Западом и Востоком","sec":"6 кл. · 5 Русские земли и их соседи в середине XIII ‒ XIV в.","c":["C.history.raspad-zolotoy-ordy","C.history.tatarskie-hanstva","C.history.kazanskoe-hanstvo","C.history.sibirskoe-hanstvo","C.history.astrahanskoe-hanstvo","C.history.nogayskaya-orda","C.history.krymskoe-hanstvo","C.history.kasimovskoe-hanstvo","C.history.narody-severnogo-kavkaza","C.history.italyanskie-faktorii-prichernomorya","C.history.kaffa","C.history.tana","C.history.soldayya"]},{"id":"OOO.history.cls.g6.el.5.10","code":"5.10","g":6,"x":"Культурное пространство. Изменения в представлениях о картине мира в Евразии в связи с завершением монгольских завоеваний. Культурное взаимодействие цивилизаций. Межкультурные связи и коммуникации (взаимодействие и взаимовлияние русской культуры и культур народов Евразии). Летописание. Литературные памятники Куликовского цикла. Жития. Епифаний Премудрый. Архитектура. Каменные соборы Кремля. Изобразительное искусство. Феофан Грек. Андрей Рублёв","sec":"6 кл. · 5 Русские земли и их соседи в середине XIII ‒ XIV в.","c":["C.history.kultura-russkih-zemel-v-xiii-xiv-vekah","C.history.kartina-mira-srednevekovogo-cheloveka","C.history.mongolskie-zavoevaniya","C.history.mezhkulturnye-svyaz ль. Русская икона как феномен мирового искусства. Повседневная жизнь горожан и сельских жителей в древнерусский и раннемосковский периоды","sec":"6 кл. · 6 Формирование единого Русского государства в XV в.","c":["C.history.kultura-edinogo-russkogo-gosudarstva","C.history.kartina-mira-srednevekovogo-cheloveka","C.history.letopis","C.history.zhitiynaya-literatura","C.history.hozhenie-za-tri-morya","C.history.afanasiy-nikitin","C.history.drevnerusskaya-arhitektura","C.history.dvortsovoe-i-tserkovnoe-stroitelstvo","C.history.moskovskiy-kreml","C.history.russkaya-ikona","C.history.povsednevnaya-zhizn-na-rusi"]},{"id":"OOO.history.cls.g6.el.7","code":"7","g":6,"x":"Наш край с древнейших времён до конца XV в.","sec":"6 класс","c":["C.history.nash-kray"]},{"id":"OOO.history.cls.g7.el.1.1","code":"1.1","g":7,"x":"Понятие «Новое время». Хронологические рамки и периодизация истории Нового времени","sec":"7 кл. · 1 Всеобщая история. История Нового времени. Конец XV ‒ XVII в.","c":["C.history.novoe-vremya","C.history.periodizatsiya-istorii-novogo-vremeni"]},{"id":"OOO.history.cls.g7.el.1.2","code":"1.2","g":7,"x":"Великие географические открытия. Предпосылки Великих географических открытий. Поиски европейцами морских путей в страны Востока. Экспедиции Колумба. Тордесильясский договор 1494 г. Открытие Васко да Гамой морского пути в Индию. Кругосветное плавание Магеллана. Плавания Тасмана и открытие Австралии. Завоевания конкистадоров в Центральной и Южной Америке (Ф. Кортес, Ф. Писарро). Европейцы в Северной Америке. Поиски северо-восточного морского пути в Китай и Индию. Политические, экономические и культурные последствия Великих географических открытий конца XV ‒ XVI в.","sec":"7 кл. · 1 Всеобщая история. История Нового времени. Конец XV ‒ XVII в.","c":["C.history.velikie-geograficheskie-otkrytiya","C.history.poiski-evropeytsami-morskih-putey-v-strany-vostoka","C.history.ekspeditsii-kolumba","C.history.hristofor-kolumb","C.history.tordesilyasskiy-dogovor","C.history.otkrytie-morskogo-puti-v-indiyu","C.history.vasko-da-gama","C.history.krugosvetnoe-plavanie-magellana","C.history.fernan-magellan","C.history.otkrytie-avstralii","C.history.abel-tasman","C.history.zavoevaniya-konkistadorov-v-amerike","C.history.konkistadory","C.history.f-kortes","C.history.f-pisarro","C.history.evropeytsy-v-severnoy-amerike","C.history.poiski-severo-vostochnogo-morskogo-puti-v-kitay-i-indiyu"]},{"id":"OOO.history.cls.g7.el.1.3","code":"1.3","g":7,"x":"Изменения в европейском обществе в XVI‒XVII вв. Развитие техники, горного дела, производства металлов. Появление мануфактур. Возникновение капиталистических отношений. Распространение наёмного труда в деревне. Расширение внутреннего и мирового рынков. Изменения в сословной структуре общества, появление новых социальных групп. Повседневная жизнь обитателей городов и деревень","sec":"7 кл. · 1 Всеобщая история. История Нового времени. Конец XV ‒ XVII в.","c":["C.history.izmeneniya-v-evropeyskom-obschestve-v-xvi-xvii-vekah","C.history.razvitie-tehniki","C.history.gornoe-delo","C.history.proizvodstvo-metallov","C.history.manufaktura","C.history.kapitalisticheskie-otnosheniya","C.history.naemnyy-trud","C.history.vnutrenniy-rynok","C.history.mirovoy-rynok","C.history.soslovie","C.history.novye-sotsialnye-gruppy","C.history.povsednevnaya-zhizn-evropeytsev-v-xvi-xvii-vekah"]},{"id":"OOO.history.cls.g7.el.1.4","code":"1.4","g":7,"x":"Реформация и контрреформация в Европе. Причины Реформации. Начало Реформации в Германии; М. Лютер. Развёртывание Реформации и Крестьянская война в Германии. Распространение протестантизма в Европе. Кальвинизм. Религиозные войны. Борьба католической церкви против реформационного движения. Контрреформация. Инквизиция","sec":"7 кл. · 1 Всеобщая история. История Нового времени. Конец XV ‒ XVII в.","c":["C.history.reformatsiya","C.history.kontrreformatsiya","C.history.nachalo-reformatsii-v-germanii","C.history.m-lyuter","C.history.krestyanskaya-voyna-v-germanii","C.history.protestantizm","C.history.kalvinizm","C.history.religioznye-voyny-v-evrope","C.history.katolicheskaya-tserkov","C.history.inkvizitsiya"]},{"id":"OOO.history.cls.g7.el.1.5","code":"1.5","g":7,"x":"Государства Европы в XVI‒XVII вв. Абсолютизм и сословное представительство. Преодоление раздробленности. Борьба за колониальные владения. Начало формирования колониальных империй","sec":"7 кл. · 1 Всеобщая история. История Нового времени. Конец XV ‒ XVII в.","c":["C.history.gosudarstva-evropy-v-xvi-xvii-vekah","C.history.absolyutizm","C.history.soslovno-predstavitelnaya-monarhiya","C.history.preodolenie-razdroblennosti","C.history.borba-za-kolonialnye-vladeniya","C.history.kolonialnaya-imperiya"]},{"id":"OOO.history.cls.g7.el.1.6","code":"1.6","g":7,"x":"Испания под властью потомков католических королей. Внутренняя и внешняя политика испанских Габсбургов. Национально- освободительное движение в Нидерландах: цели, участники, формы борьбы. Итоги и значение Нидерландской революции","sec":"7 кл. · 1 Всеобщая история. История Нового времени. Конец XV ‒ XVII в.","c":["C.history.ispaniya","C.history.katolicheskie-koroli","C.history.ispanskie-gabsburgi","C.history.niderlandskaya-revolyutsiya","C.history.niderlandy"]},{"id":"OOO.history.cls.g7.el.1.7","code":"1.7","g":7,"x":"Франция: путь к абсолютизму. Королевская власть и централизация управления страной. Католики и гугеноты. Религиозные войны. Генрих IV. Нантский эдикт 1598 г. Людовик XIII и кардинал Ришелье. Фронда. Французский абсолютизм при Людовике XIV","sec":"7 кл. · 1 Всеобщая история. История Нового времени. Конец XV ‒ XVII в.","c":["C.history.frantsiya","C.history.tsentralizatsiya-upravleniya-vo-frantsii","C.history.gugenoty","C.history.religioznye-voyny-vo-frantsii","C.history.genrih-iv","C.history.nantskiy-edikt","C.history.lyudovik-xiii","C.history.kardinal-rishele","C.history.fronda","C.history.frantsuzskiy-absolyutizm","C.history.lyudovik-xiv"]},{"id":"OOO.history.cls.g7.el.1.8","code":"1.8","g":7,"x":"Англия. Развитие капиталистического предпринимательства в городах и деревнях. Огораживания. Укрепление королевской власти при Тюдорах. Генрих VIII и королевская реформация. «Золотой век» Елизаветы I. Английская революция середины XVII в. Причины, участники, этапы революции. Размежевание в революционном лагере. О. Кромвель. Итоги и значение революции. Реставрация Стюартов. Славная революция. Становление английской парламентской монархии","sec":"7 кл. · 1 Всеобщая история. История Нового времени. Конец XV ‒ XVII в.","c":["C.history.angliya","C.history.kapitalisticheskoe-predprinimatelstvo","C.history.ogorazhivaniya","C.history.tyudory","C.history.genrih-viii","C.history.korolevskaya-reformatsiya-v-anglii","C.history.zolotoy-vek-elizavety-i","C.history.elizaveta-i","C.history.angliyskaya-revolyutsiya","C.history.razmezhevanie-v-revolyutsionnom-lagere","C.history.o-kromvel","C.history.restavratsiya-styuartov","C.history.styuarty","C.history.slavnaya-revolyutsiya","C.history.parlamentskaya-monarhiya"]},{"id":"OOO.history.cls.g7.el.1.9","code":"1.9","g":7,"x":"Страны Центральной, Южной и Юго-Восточной Европы. В мире империй и вне его. Германские государства. Итальянские земли. Положение славянских народов. Образование Речи Посполитой","sec":"7 кл. · 1 Всеобщая история. История Нового времени. Конец XV ‒ XVII в.","c":["C.history.strany-tsentralnoy-yuzhnoy-i-yugo-vostochnoy-evropy","C.history.germanskie-gosudarstva","C.history.italyanskie-gosudarstva","C.history.slavyane","C.history.obrazovanie-rechi-pospolitoy","C.history.rech-pospolitaya"]},{"id":"OOO.history.cls.g7.el.1.10","code":"1.10","g":7,"x":"Международные отношения в XVI‒XVII вв. Борьба за первенство, военные конфликты между европейскими державами. Столкновение интересов в приобретении колониальных владений и господстве на торговых путях. Противостояние османской экспансии в Европе. Образование державы австрийских Габсбургов. Тридцатилетняя война. Вестфальский мир","sec":"7 кл. · 1 Всеобщая история. История Нового времени. Конец XV ‒ XVII в.","c":["C.history.mezhdunarodnye-otnosheniya-v-xvi-xvii-vekah","C.history.voennye-konflikty-mezhdu-evropeyskimi-derzhavami","C.history.borba-za-kolonialnye-vladeniya","C.history.protivostoyanie-osmanskoy-ekspansii-v-evrope","C.history.derzhava-avstriyskih-gabsburgov","C.history.tridtsatiletnyaya-voyna","C.history.vestfalskiy-mir"]},{"id":"OOO.history.cls.g7.el.1.11","code":"1.11","g":7,"x":"Европейская культура в раннее Новое время. Высокое Возрождение в Италии: художники и их произведения. Северное Возрождение. Мир человека в литературе раннего Нового времени. М. Сервантес. У. Шекспир. Стили художественной культуры (барокко, классицизм). Французский театр эпохи классицизма. Развитие науки: переворот в естествознании, возникновение новой картины мира. Выдающиеся учёные и их открытия (Н. Коперник, И. Ньютон). Утверждение рационализма","sec":"7 кл. · 1 Всеобщая история. История Нового времени. Конец XV ‒ XVII в.","c":["C.history.evropeyskaya-kultura-rannego-novogo-vremeni","C.history.rannee-novoe-vremya","C.history.vysokoe-vozrozhdenie","C.history.severnoe-vozrozhdenie","C.history.literatura-rannego-novogo-vremeni","C.history.m-servantes","C.history.u-shekspir","C.history.barokko","C.history.klassitsizm","C.history.frantsuzskiy-teatr-epohi-klassitsizma","C.history.nauka-rannego-novogo-vremeni","C.history.perevorot-v-estestvoznanii","C.history.novaya-kartina-mira","C.history.n-kopernik","C.history.i-nyuton","C.history.ratsionalizm"]},{"id":"OOO.history.cls.g7.el.1.12","code":"1.12","g":7,"x":"Страны Востока в XVI‒XVII вв. Османская империя: на вершине могущества. Сулейман I Великолепный: завоеватель, законодатель. Управление многонациональной империей. Османская армия. Индия при Великих Моголах. Начало проникновения европейцев. Ост-Индские компании. Китай в эпоху Мин. Экономическая и социальная политика государства. Утверждение маньчжурской династии Цин. Япония: борьба знатных кланов за власть, установление сёгуната Токугава, укрепление централизованного государства. «Закрытие» страны для иноземцев. Культура и искусство стран Востока в XVI‒ XVII вв. Историческое и культурное наследие Раннего Нового времени","sec":"7 кл. · 1 Всеобщая история. История Нового времени. Конец XV ‒ XVII в.","c":["C.history.strany-vostoka-v-xvi-xvii-vekah","C.history.osmanskaya-imperiya","C.history.suleyman-i-velikolepnyy","C.history.upravlenie-osmanskoy-imperiey","C.history.osmanskaya-armiya","C.history.imperiya-velikih-mogolov","C.history.proniknovenie-evropeytsev-v-strany-vostoka","C.history.ost-indskie-kompanii","C.history.dinastiya-min","C.history.dinastiya-tsin","C.history.borba-znatnyh-klanov-za-vlast-v-yaponii","C.history.segunat-tokugava","C.history.tsentralizovannoe-gosudarstvo","C.history.zakrytie-yaponii-dlya-inozemtsev","C.history.kultura-narodov-vostoka","C.history.nasledie-rannego-novogo-vremeni"]},{"id":"OOO.history.cls.g7.el.2.1","code":"2.1","g":7,"x":"Завершение объединения русских земель. Княжение Василия III. Завершение объединения русских земель вокруг Москвы: присоединение Псковской, Смоленской, Рязанской земель. Отмирание удельной системы. Укрепление великокняжеской власти. Органы государственной власти. Приказная система: формирование первых приказных учреждений. Боярская дума, её роль в управлении государством. «Малая дума». Местничество. Местное управление: наместники и волостели, система кормлений. Государство и церковь","sec":"7 кл. · 2 Россия в XVI в.","c":["C.history.zavershenie-obedineniya-russkih-zemel","C.history.vasiliy-iii","C.history.moskva","C.history.prisoedinenie-pskova-k-moskve","C.history.prisoedinenie-smolenska-k-moskve","C.history.prisoedinenie-ryazani-k-moskve","C.history.udelnaya-sistema","C.history.ukreplenie-velikoknyazheskoy-vlasti","C.history.organy-gosudarstvennoy-vlasti","C.history.prikaznaya-sistema","C.history.boyarstvo","C.history.boyarskaya-duma","C.history.malaya-duma","C.history.mestnichestvo","C.history.mestnoe-upravlenie","C.history.namestnik","C.history.volostel","C.history.kormlenie","C.history.gosuda tory.stoglavyy-sobor","C.history.zemskaya-reforma","C.history.mestnoe-samoupravlenie"]},{"id":"OOO.history.cls.g7.el.2.5","code":"2.5","g":7,"x":"Внешняя политика России в XVI в. Создание стрелецких полков и «Уложение о службе». Присоединение Казанского и Астраханского ханств. Значение включения Среднего и Нижнего Поволжья в состав Российского государства. Войны с Крымским ханством. Битва при Молодях. Укрепление южных границ. Ливонская война: причины и характер. Ликвидация Ливонского ордена. Причины и результаты поражения России в Ливонской войне. Поход Ермака Тимофеевича на Сибирское ханство. Начало присоединения к России Западной Сибири","sec":"7 кл. · 2 Россия в XVI в.","c":["C.history.vneshnyaya-politika-rossii","C.history.streletskoe-voysko","C.history.ulozhenie-o-sluzhbe","C.history.prisoedinenie-kazanskogo-hanstva","C.history.prisoedinenie-astrahanskogo-hanstva","C.history.povolzhe","C.history.voyny-s-krymskim-hanstvom","C.history.krymskoe-hanstvo","C.history.bitva-pri-molodyah","C.history.ukreplenie-yuzhnyh-granits","C.history.livonskaya-voyna","C.history.likvidatsiya-livonskogo-ordena","C.history.livonskiy-orden","C.history.pohod-ermaka","C.history.ermak-timofeevich","C.history.sibirskoe-hanstvo","C.history.prisoedinenie-zapadnoy-sibiri"]},{"id":"OOO.history.cls.g7.el.2.6","code":"2.6","g":7,"x":"Социальная структура российского общества. Дворянство. Служилые люди. Формирование Государева двора и «служилых городов». Торгово-ремесленное население городов. Духовенство. Начало закрепощения крестьян: Указ о «заповедных летах». Формирование вольного казачества. Многонациональный состав населения Русского государства. Финно- угорские народы. Народы Поволжья после присоединения к России. Служилые татары. Сосуществование религий в Российском государстве. Русская православная церковь. Мусульманское духовенство","sec":"7 кл. · 2 Россия в XVI в.","c":["C.history.sotsialnaya-struktura-rossiyskogo-obschestva","C.history.dvoryanstvo","C.history.sluzhilye-lyudi","C.history.gosudarev-dvor","C.history.sluzhilyy-gorod","C.history.posadskoe-naselenie","C.history.duhovenstvo","C.history.zakreposchenie-krestyan","C.history.ukaz-o-zapovednyh-letah","C.history.kazachestvo","C.history.mnogonatsionalnyy-sostav-naseleniya-rossii","C.history.finno-ugry","C.history.narody-povolzhya","C.history.sluzhilye-tatary","C.history.sosuschestvovanie-religiy-v-rossii","C.history.russkaya-tserkov","C.history.musulmanskoe-duhovenstvo"]},{"id":"OOO.history.cls.g7.el.2.7","code":"2.7","g":7,"x":"Опричнина, дискуссия о её причинах и характере. Опричный террор. Разгром Новгорода и Пскова. Московские казни 1570 г. Результаты и последствия опричнины. Противоречивость личности Ивана Грозного. Результаты и цена преобразований","sec":"7 кл. · 2 Россия в XVI в.","c":["C.history.oprichnina","C.history.oprichnyy-terror","C.history.razgrom-novgoroda-i-pskova","C.history.moskovskie-kazni-1570-goda","C.history.ivan-iv"]},{"id":"OOO.history.cls.g7.el.2.8","code":"2.8","g":7,"x":"Россия в конце XVI в. Царь Федор Иванович. Борьба за власть в боярском окружении. Правление Бориса Годунова. Учреждение патриаршества. Тявзинский мирный договор со Швецией: восстановление позиций России в Прибалтике. Противостояние с Крымским ханством. Строительство российских крепостей и засечных черт. Продолжение закрепощения крестьянства: Указ об «урочных летах». Пресечение царской династии Рюриковичей","sec":"7 кл. · 2 Россия в XVI в.","c":["C.history.rossiya-v-kontse-xvi-veka","C.history.fedor-ivanovich","C.history.borba-za-vlast-v-boyarskom-okruzhenii","C.history.boris-godunov","C.history.uchrezhdenie-patriarshestva","C.history.patriarshestvo","C.history.tyavzinskiy-mirnyy-dogovor","C.history.shvetsiya","C.history.pribaltika","C.history.krymskoe-hanstvo","C.history.zasechnaya-cherta","C.history.zakreposchenie-krestyan","C.history.ukaz-ob-urochnyh-letah","C.history.presechenie-dinastii-ryurikovichey","C.history.dinastiya-ryurikovichey"]},{"id":"OOO.history.cls.g7.el.3.1","code":"3.1","g":7,"x":"Накануне Смуты. Династический кризис. Земский собор 1598 г. и избрание на царство Бориса Годунова. Политика Бориса Годунова в отношении боярства. Голод 1601–1603 гг. и обострение социально- экономического кризиса","sec":"7 кл. · 3 Смута в России","c":["C.history.dinasticheskiy-krizis","C.history.smuta","C.history.zemskiy-sobor-1598-goda","C.history.boris-godunov","C.history.boyarstvo","C.history.golod-1601-1603-godov","C.history.sotsialno-ekonomicheskiy-krizis-nachala-xvii-veka"]},{"id":"OOO.history.cls.g7.el.3.2","code":"3.2","g":7,"x":"Смутное время начала XVII в. Дискуссия о его причинах. Самозванцы и самозванство. Личность Лжедмитрия I и его политика. Восстание 1606 г. и убийство самозванца","sec":"7 кл. · 3 Смута в России","c":["C.history.smuta","C.history.samozvanstvo","C.history.lzhedmitriy-i","C.history.vosstanie-1606-goda"]},{"id":"OOO.history.cls.g7.el.3.3","code":"3.3","g":7,"x":"Царь Василий Шуйский. Восстание Ивана Болотникова. Перерастание внутреннего кризиса в гражданскую войну. Лжедмитрий II. Вторжение на территорию России польско-литовских отрядов. Тушинский лагерь самозванца под Москвой. Оборона Троице-Сергиева монастыря. Выборгский договор между Россией и Швецией. Поход войска М.В. Скопина-Шуйского и Я.-П. Делагарди и распад тушинского лагеря. Открытое вступление Речи Посполитой в войну против России. Оборона Смоленска","sec":"7 кл. · 3 Смута в России","c":["C.history.vasiliy-shuyskiy","C.history.vosstanie-ivana-bolotnikova","C.history.ivan-bolotnikov","C.history.grazhdanskaya-voyna-v-gody-smuty","C.history.lzhedmitriy-ii","C.history.polsko-litovskaya-interventsiya","C.history.tushinskiy-lager","C.history.oborona-troitse-sergieva-monastyrya","C.history.vyborgskiy-dogovor","C.history.shvetsiya","C.history.pohod-skopina-shuyskogo-i-delagardi","C.history.m-v-skopin-shuyskiy","C.history.ya-p-delagardi","C.history.voyna-rechi-pospolitoy-protiv-rossii","C.history.rech-pospolitaya","C.history.oborona-smolenska"]},{"id":"OOO.history.cls.g7.el.3.4","code":"3.4","g":7,"x":"Свержение Василия Шуйского и переход власти к «семибоярщине». Договор об избрании на престол польского принца Владислава и вступление польско-литовского гарнизона в Москву. Подъём национально-освободительного движения. Патриарх Гермоген. Московское восстание 1611 г. и сожжение города оккупантами. Первое и второе земские ополчения. Захват Новгорода шведскими войсками. «Совет всея земли». Освобождение Москвы в 1612 г.","sec":"7 кл. · 3 Смута в России","c":["C.history.sverzhenie-vasiliya-shuyskogo","C.history.semiboyarschina","C.history.dogovor-ob-izbranii-na-prestol-printsa-vladislava","C.history.prints-vladislav","C.history.polsko-litovskaya-interventsiya","C.history.natsionalno-osvoboditelnoe-dvizhenie-v-smutnoe-vremya","C.history.patriarh-germogen","C.history.moskovskoe-vosstanie-1611-goda","C.history.pervoe-zemskoe-opolchenie","C.history.vtoroe-zemskoe-opolchenie","C.history.zahvat-novgoroda-shvedskimi-voyskami","C.history.sovet-vseya-zemli","C.history.osvobozhdenie-moskvy-v-1612-godu"]},{"id":"OOO.history.cls.g7.el.3.5","code":"3.5","g":7,"x":"Окончание Смуты. Земский собор 1613 г. и его роль в укреплении государственности. Избрание на царство Михаила Федоровича Романова. Борьба с казачьими выступлениями против центральной власти. Столбовский мир со Швецией: утрата выхода к Балтийскому морю. Продолжение войны с Речью Посполитой. Поход принца Владислава на Москву. Заключение Деулинского перемирия с Речью Посполитой. Итоги и последствия Смутного времени","sec":"7 кл. · 3 Смута в России","c":["C.history.okonchanie-smuty","C.history.smuta","C.history.zemskiy-sobor-1613-goda","C.history.mihail-fedorovich","C.history.borba-s-kazachimi-vystupleniyami","C.history.stolbovskiy-mir","C.history.shvetsiya","C.history.baltiyskoe-more","C.history.voyna-rechi-pospolitoy-protiv-rossii","C.history.pohod-vladislava-na-moskvu","C.history.prints-vladislav","C.history.deulinskoe-peremirie","C.history.rech-pospolitaya"]},{"id":"OOO.history.cls.g7.el.4.1","code":"4.1","g":7,"x":"Россия при первых Романовых. Царствование Михаила Федоровича. Восстановление экономического потенциала страны. Продолжение закрепощения крестьян. Земские соборы. Роль патриарха Филарета в управлении государством","sec":"7 кл. · 4 Россия в XVII в.","c":["C.history.dinastiya-romanovyh","C.history.mihail-fedorovich","C.history.vosstanovlenie-ekonomiki-posle-smuty","C.history.zakreposchenie-krestyan","C.history.zemskiy-sobor","C.history.patriarh-filaret"]},{"id":"OOO.history.cls.g7.el.4.2","code":"4.2","g":7,"x":"Царь Алексей Михайлович. Укрепление самодержавия. Ослабление роли Боярской думы в управлении государством. Развитие приказного строя. Приказ Тайных дел. Усиление воеводской власти в уездах и постепенная ликвидация земского самоуправления. Соборное уложение 1649 г. Завершение оформления крепостного права и территория его распространения. Денежная реформа 1654 г. Затухание деятельности земских соборов. Правительство Б.И. Морозова и И.Д. Милославского: итоги его деятельности","sec":"7 кл. · 4 Россия в XVII в.","c":["C.history.aleksey-mihaylovich","C.history.samoderzhavie","C.history.boyarskaya-duma","C.history.prikaznaya-sistema","C.history.prikaz-taynyh-del","C.history.voevoda","C.history.mestnoe-samoupravlenie","C.history.sobornoe-ulozhenie","C.history.krepostnoe-pravo","C.history.denezhnaya-reforma-1654-goda","C.history.zemskiy-sobor","C.history.b-i-morozov","C.history.i-d-miloslavskiy"]},{"id":"OOO.history.cls.g7.el.4.3","code":"4.3","g":7,"x":"Патриарх Никон, его конфликт с царской властью. Раскол в Церкви. Протопоп Аввакум, формирование религиозной традиции старообрядчества","sec":"7 кл. · 4 Россия в XVII в.","c":["C.history.patriarh-nikon","C.history.konflikt-patriarha-nikona-s-tsarskoy-vlastyu","C.history.tserkovnyy-raskol","C.history.protopop-avvakum","C.history.staroobryadchestvo"]},{"id":"OOO.history.cls.g7.el.4.4","code":"4.4","g":7,"x":"Царь Фёдор Алексеевич. Отмена местничества. Налоговая (податная) реформа","sec":"7 кл. · 4 Россия в XVII в.","c":["C.history.fedor-alekseevich","C.history.otmena-mestnichestva","C.history.mestnichestvo","C.history.podatnaya-reforma"]},{"id":"OOO.history.cls.g7.el.4.5","code":"4.5","g":7,"x":"Экономическое развитие России в XVII в. Первые мануфактуры. Ярмарки. Укрепление внутренних торговых связей и развитие хозяйственной специализации регионов Российского государства. Торговый и Новоторговый уставы. Торговля с европейскими странами и Востоком","sec":"7 кл. · 4 Россия в XVII в.","c":["C.history.ekonomicheskoe-razvitie-rossii-v-xvii-veke","C.history.manufaktura","C.history.yarmarka","C.history.vnutrenniy-rynok","C.history.hozyaystvennaya-spetsializatsiya-regionov","C.history.torgovyy-ustav","C.history.novotorgovyy-ustav","C.history.vneshnyaya-torgovlya-rossii"]},{"id":"OOO.history.cls.g7.el.4.6","code":"4.6","g":7,"x":"Социальная структура российского общества. Государев двор, служилый город, духовенство, торговые люди, посадское население, стрельцы, служилые иноземцы, казаки, крестьяне, холопы. Русская деревня в XVII в.","sec":"7 кл. · 4 Россия в XVII в.","c":["C.history.sotsialnaya-struktura-rossiyskogo-obschestva","C.history.gosudarev-dvor","C.history.sluzhilyy-gorod","C.history.duhovenstvo","C.history.torgovye-lyudi","C.history.posadskoe-naselenie","C.history.streletskoe-voysko","C.history.sluzhilye-inozemtsy","C.history.kazachestvo","C.history.krestyanstvo","C.history.holop","C.history.russkaya-derevnya-v-xvii-veke"]},{"id":"OOO.history.cls.g7.el.4.7","code":"4.7","g":7,"x":"Городские восстания середины XVII в. Соляной бунт в Москве. Псковско-Новгородское восстание. Медный бунт. Побеги крестьян на Дон и в Сибирь. Восстание Степана Разина","sec":"7 кл. · 4 Россия в XVII в.","c":["C.history.gorodskie-vosstaniya-serediny-xvii-veka","C.history.solyanoy-bunt","C.history.pskovsko-novgorodskoe-vosstanie","C.history.mednyy-bunt","C.history.pobegi-krestyan-na-don-i-v-sibir","C.history.vosstanie-stepana-razina","C.history.stepan-razin"]},{"id":"OOO.history.cls.g7.el.4.8","code":"4.8","g":7,"x":"Внешняя политика России в XVII в. Возобновление дипломатических контактов со странами Европы и Азии после Смуты. Смоленская война. Поляновский мир. Контакты с православным населением Речи Посполитой: противодействие полонизации, распространению католичества. Контакты с Запорожской Сечью. Восстание Богдана Хмельницкого. Переяславская рада. Вхождение земель Войска Запорожского в состав России. Война между Россией и Речью Посполитой 1654–1667 гг. Андрусовское перемирие. Русско- шведская война 1656–1658 гг. и её результаты. Укрепление южных рубежей. Белгородская засечная черта. Конфликты с Османской империей. «Азовское осадное сидение». «Чигиринская война» и Бахчисарайский мирный договор. Отношения России со странами Западной Европы. Военные столкновения с маньчжурами и империей Цин (Китаем)","sec":"7 кл. · 4 Россия в XVII в.","c":["C.history.vneshnyaya-politika-rossii","C.history.mezhdunarodnye-svyazi-moskovskogo-gosudarstva","C.history.smolenskaya-voyna","C.history.polyanovskiy-mir","C.history.pravoslavnoe-naselenie-rechi-pospolitoy","C.history.polonizatsiya","C.history.katolitsizm","C.history.zaporozhskaya-sech","C.history.vosstanie-bogdana-hmelnitskogo","C.history.bogdan-hmelnitskiy","C.history.pereyaslavskaya-rada","C.history.vhozhdenie-zemel-voyska-zaporozhskogo-v-sostav-rossii","C.history.russko-polskaya-voyna-1654-1667-godov","C.history.andrusovskoe-peremirie","C.history.russko-shvedskaya-voyna-1656-1658-godov","C.history.ukreplenie-yuzhnyh-granits","C.history.belgorodskaya-zasechnaya-cherta","C.history.osmanskaya-imperiya","C.history.azovskoe-osadnoe-sidenie","C.history.chigirinskaya-voyna","C.history.bahchisarayskiy-mirnyy-dogovor","C.history.voennye-stolknoveniya-s-imperiey-tsin","C.history.dinastiya-tsin"]},{"id":"OOO.history.cls.g7.el.4.9","code":"4.9","g":7,"x":"Освоение новых территорий. Народы России в XVII в. Эпоха Великих географических открытий и русские географические открытия. Плавание Семёна Дежнёва. Выход к Тихому океану. Походы Ерофея Хабарова и Василия Пояркова и исследование бассейна реки Амур. Освоение Поволжья и Сибири. Калмыцкое ханство. Ясачное налогообложение. Переселение русских на новые земли. Миссионерство и христианизация. Межэтнические отношения. Формирование многонациональной элиты","sec":"7 кл. · 4 Россия в XVII в.","c":["C.history.osvoenie-novyh-territoriy","C.history.mnogonatsionalnyy-sostav-naseleniya-rossii","C.history.velikie-geograficheskie-otkrytiya","C.history.russkie-geograficheskie-otkrytiya","C.history.plavanie-semena-dezhneva","C.history.semen-dezhnev","C.history.vyhod-k-tihomu-okeanu","C.history.pohody-habarova-i-poyarkova","C.history.erofey-habarov","C.history.vasiliy-poyarkov","C.history.amur","C.history.povolzhe","C.history.osvoenie-sibiri","C.history.sibir","C.history.kalmytskoe-hanstvo","C.history.yasak","C.history.pereselenie-russkih-na-novye-zemli","C.history.missionerstvo","C.history.mezhetnicheskie-otnosheniya","C.history.mnogonatsionalnaya-elita"]},{"id":"OOO.history.cls.g7.el.4.10","code":"4.10","g":7,"x":"Культурное пространство XVI–XVII вв. Изменения в картине мира человека в XVI‒XVII вв. и повседневная жизнь. Жилище и предметы быта. Семья и семейные отношения. Религия и суеверия. Проникновение элементов европейской культуры в быт высших слоёв населения страны. Архитектура. Дворцово-храмовый ансамбль Соборной площади в Москве. Шатровый стиль в архитектуре. Антонио Солари, Алевиз Фрязин, Петрок Малой. Собор Покрова на Рву. Монастырские ансамбли (Кирилло-Белозерский, Соловецкий, Ново- Иерусалимский). Крепости (Китай-город, Смоленский, Астраханский, Ростовский кремли). Фёдор Конь. Приказ каменных дел. Деревянное зодчество. Изобразительное искусство. Симон Ушаков. Ярославская школа иконописи. Парсунная живопись. Летописание и начало книгопечатания. Лицевой свод. Домострой. Переписка Ивана Грозного с князем Андреем Курбским. Публицистика Смутного времени. Усиление светского начала в российской культуре. Симеон Полоцкий. Немецкая слобода как проводник европейского культурного влияния. Посадская сатира XVII в. Развитие образования и научных знаний. Школы при Аптекарском и Посольском приказах. «Синопсис» Иннокентия Гизеля ‒ первое учебное пособие по истории","sec":"7 кл. · 4 Россия в XVII в.","c":["C.history.kultura-rossii-xvi-xvii-vekov","C.history.kartina-mira-cheloveka-v-xvi-xvii-vekah","C.history.povsednevnaya-zhizn-na-rusi","C.history.zhilische-i-predmety-byta","C.history.semya-i-semeynye-otnosheniya","C.history.sueveriya","C.history.proniknovenie-evropeyskoy-kultury-v-rossiyu","C.history.drevnerusskaya-arhitektura","C.history.ansambl-sobornoy-ploschadi-v-moskve","C.history.shatrovyy-stil","C.history.antonio-solari","C.history.aleviz-fryazin","C.history.petrok-maloy","C.history.sobor-pokrova-na-rvu","C.history.monastyrskie-ansambli","C.history.kirillo-belozerskiy-monastyr","C.history.solovetskiy-monastyr","C.history.novo-ierusalimskiy-monastyr","C.history.krepostnoe-zodchestvo","C.history.kitay-gorod","C.history.smolenskiy-kreml","C.history.astrahanskiy-kreml","C.history.rostovskiy-kreml","C.history.fedor-kon","C.history.prikaz-kamennyh-del","C.history.derevyannoe-zodchestvo","C.history.izobrazitelnoe-iskusstvo-rusi","C.history.simon-ushakov","C.history.yaroslavskaya-shkola-ikonopisi","C.history.parsunnaya-zhivopis","C.history.letopis","C.history.nachalo-knigopechataniya-v-rossii","C.history.litsevoy-svod","C.history.domostroy","C.history.perepiska-ivana-groznogo-s-andreem-kurbskim","C.history.ivan-iv","C.history.andrey-kurbskiy","C.history.publitsistika-smutnogo-vremeni","C.history.usilenie-svetskogo-nachala-v-kulture","C.history.simeon-polotskiy","C.history.nemetskaya-sloboda","C.history.posadskaya-satira","C.history.obrazovanie-i-nauchnye-znaniya-v-rossii","C.history.shkoly-pri-prikazah","C.history.sinopsis","C.history.innokentiy-gizel"]},{"id":"OOO.history.cls.g7.el.5","code":"5","g":7,"x":"Наш край в XVI‒XVII вв.","sec":"7 класс","c":["C.history.nash-kray"]}],"rels":[["C.history.drevniy-mir","C.history.sred
