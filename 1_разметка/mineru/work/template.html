<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Физика — кодификаторы</title>
<script>
window.MathJax = {
  tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] },
  options: { skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'] },
  chtml: { scale: 1.05 }
};
</script>
<script async src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-chtml-full.min.js"></script>
<style>
  :root { --fg: #1d1d1f; --bg: #fbfbf8; --line: #c9c9c2; --head: #efeee8; --muted: #66665f; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 16px/1.5 "Times New Roman", Georgia, serif; }
  main { max-width: 980px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 1.35rem; margin: 48px 0 16px; padding-bottom: 6px; border-bottom: 2px solid var(--fg); }
  section:first-child h1 { margin-top: 8px; }
  p { margin: 10px 0; }
  .tw { overflow-x: auto; margin: 12px 0 20px; }
  table { border-collapse: collapse; width: 100%; }
  td, th { border: 1px solid var(--line); padding: 5px 8px; vertical-align: top; text-align: left; }
  th, tr:first-child td { background: var(--head); font-weight: 600; }
  td:first-child, td:nth-child(2) { white-space: nowrap; }
  td:last-child { white-space: normal; }
  img { max-width: min(100%, 300px); vertical-align: middle; display: block; margin: 6px 0; }
  mjx-container { margin: 0 2px; }
</style>
</head>
<body>
<main>
{{BODY}}
</main>
</body>
</html>
